// Scroll reveals, the header's progress line and active link, and the readouts counting up once.
function landingMotion(root) {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const els = [...root.querySelectorAll('.rv')];
  if (reduce || !('IntersectionObserver' in window)) els.forEach((e) => e.classList.add('shown'));
  else {
    const io = new IntersectionObserver((ents) => ents.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('shown'); io.unobserve(en.target); } }), { rootMargin: '0px 0px 20% 0px', threshold: 0 });
    els.forEach((e) => io.observe(e));
  }
  const ro = root.querySelector('#readouts');
  const countUp = () => {
    if (!ro || ro.dataset.counted) return; ro.dataset.counted = '1';
    if (reduce) return;
    ro.querySelectorAll('b[data-n]').forEach((b) => {
      const n = Number(b.dataset.n); if (!n) return; const f = b.dataset.k === 'c' ? compact : fmt; const t0 = performance.now(), D = 1300;
      const step = (now) => { const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3); if (!b.isConnected) return; b.textContent = f(b.dataset.k === 'c' ? n * e : Math.round(n * e)); if (p < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  };
  if (ro && 'IntersectionObserver' in window) { const io2 = new IntersectionObserver((e) => { if (e[0].isIntersecting) { countUp(); io2.disconnect(); } }, { threshold: 0.4 }); io2.observe(ro); } else countUp();
  const bar = root.querySelector('.bar-prog'), links = [...root.querySelectorAll('.bar [data-scroll]')];
  const onScroll = () => {
    if (!bar || !bar.isConnected) return window.removeEventListener('scroll', onScroll);
    const max = document.documentElement.scrollHeight - innerHeight; bar.style.transform = `scaleX(${max > 0 ? Math.min(1, scrollY / max) : 0})`;
    let cur = ''; for (const a of links) { const sec = document.getElementById(a.dataset.scroll); if (sec && sec.getBoundingClientRect().top < innerHeight * 0.45) cur = a.dataset.scroll; }
    links.forEach((a) => a.classList.toggle('on', a.dataset.scroll === cur));
  };
  window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
}
// Keeps the terminal and readouts current while the landing page is open.
function startLandingLive(root, firstLog) {
  let seen = new Set(firstLog.map(logKey)); let tick = 0;
  const loop = setInterval(async () => {
    if (!document.body.contains(root.querySelector('#term-log'))) return clearInterval(loop);
    if (document.hidden || (typeof Activity !== 'undefined' && Activity.idle())) return;
    tick++;
    try {
      const L = await landingData();
      const q = (sel) => root.querySelector(sel);
      if (!q('#term-log')) return;
      q('#term-status').innerHTML = termStatus(L);
      q('#term-foot').innerHTML = termFoot(L);
      q('#readouts').innerHTML = readoutsHtml(L);
      q('#term-log').innerHTML = L.log.map((e) => logLine(e, !seen.has(logKey(e)))).join('');
      if (tick % 2 === 0) fillLandingTreasury(root); // the treasury changes slowly: every minute is plenty
      seen = new Set(L.log.map(logKey));
    } catch (e) { console.warn('landing refresh', e); }
  }, 30000);
  const clock = setInterval(() => {
    const u = root.querySelector('#term-upd');
    if (!u) return clearInterval(clock);
    u.innerHTML = `<b>live</b> · updated ${esc(ago(Data.at))}`;
  }, 1000);
}
async function fillLandingTreasury(root) {

const logKey = (e) => `${e.v}|${e.s}|${e.r}|${e.at}`;

/* ---------- the terminal log: real recent events, oldest first ---------- */
function buildLog(workflows, launches, oracle, jobs) {
  const ev = [];
  for (const l of launches) ev.push({ at: l.createdAt, v: l.status === 'live' ? 'launched' : 'parked', s: `#${l.launchNumber} ${launchTitle(l)}`, r: l.status === 'live' ? `${(l.artifacts || []).length} contracts · sepolia` : 'stopped by review' });
  for (const w of workflows) {
    const t = workflowTitle(w);
    ev.push({ at: w.updatedAt, v: 'release', s: `${t.name}${t.symbol ? ' $' + t.symbol : ''}`, r: w.status });
  }
  for (const q of oracle.filter((x) => x.attestedAt)) {
    const a = answers.get(q.id);
    ev.push({ at: q.attestedAt, v: 'oracle', s: q.question, r: a != null ? `→ ${a}` : 'signed' });
  }
  for (const j of jobs.filter((x) => x.state !== 'completed' || jobType(x) !== 'oracle')) {
    ev.push({ at: j.updatedAt, v: j.state === 'completed' ? 'done' : j.state === 'executing' ? 'working' : j.state, s: jobTitle(j), r: JOB_TYPES[jobType(j)].label.toLowerCase() });
  }
  return ev.filter((e) => Date.parse(e.at)).sort((a, b) => Date.parse(a.at) - Date.parse(b.at)).slice(-6);
}
function logLine(e, fresh = false) {
  const t = new Date(e.at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  return `<div class="ln${fresh ? ' fresh' : ''}"><span class="p">&gt;</span><span class="t">${esc(t)}</span><span class="v">${esc(e.v)}</span><span class="s">${esc(e.s)}</span><span class="r">${esc(e.r)}</span></div>`;
}

/* ---------- terminal commands ---------- */
const COMMANDS = {
  help: 'commands: overview · agents · tasks · releases · launches · showcase · oracle · seats · holders · tokenomics · treasury · launch\n          seat <number> · wallet <0x address> · buy · theme · clear',
};
function bindTerminal(root) {
  const form = root.querySelector('#term-form'); const input = root.querySelector('#term-in'); const out = root.querySelector('#term-out');
  const say = (s) => { out.textContent = s; };
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const raw = input.value.trim(); input.value = '';
    if (!raw) return;
    const [cmd, arg] = raw.toLowerCase().split(/\s+/, 2);
    const go = (hash) => { say(`opening ${hash}…`); setTimeout(() => { location.hash = hash; }, 180); };
    if (cmd === 'help' || cmd === '?') return say(COMMANDS.help);
    if (cmd === 'clear') { root.querySelector('#term-log').innerHTML = ''; return say(''); }
    if (cmd === 'theme') { Theme.toggle(); return say(`theme: ${Theme.current()}`); }
    if (cmd === 'seat') {
      if (!/^\d{1,4}$/.test(arg || '')) return say('usage: seat 42');
      return openSeat(arg);
    }
    if (cmd === 'wallet') {
      if (!isAddr(arg || '')) return say('usage: wallet 0x… (a full 42-character address)');
      store.set('wallet', arg); return go('wallet');
    }
    if (cmd === 'app') return go('overview');
    if (cmd === 'launch' || cmd === 'build') return go('build');
    if (cmd === 'buy') {
      if (!buyUrl()) return say(`${TICKER()} opens for trading at launch. The Buy link appears here once the contract is published.`);
      say(`opening Uniswap for ${TICKER()}…`); const a = document.createElement('a'); a.href = buyUrl(); a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); return;
    }
    if (VIEWS[cmd]) return go(cmd);
    say(`unknown command: ${raw.slice(0, 40)}. type help`);
  });
}

/* ---------- the instrument wall ---------- */
function startWall(canvas, data) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const INK = '#0C0C0B', FACE = '#E4E4DE', WALL = '#D5D5CE', SCREEN = '#0A0B0A', PH = '#43E07D', PHD = '#1E6B3A';
  const readouts = [data.h.agentsOnline, data.h.seatsEnrolled, data.c.launchesLive, data.c.sites, data.h.oraclesDoneLastDay, data.c.jobs, data.h.jobsDoneLastDay, data.c.jobStates?.completed].filter((n) => n != null).map(String);
  const words = ['SEAT', 'SWARM', 'ORACLE', 'DEPLOY', 'VERIFY', 'IPFS', 'ENS', 'PANEL', 'QUORUM', 'REVIEW', 'LAUNCH', 'AGENT'];
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  let mods = []; let w = 0, hgt = 0;

  function layout() {
    seed = 7; mods = [];
    const U = w < 700 ? 34 : 44;
    const rows = [];
    let y = 4;
    while (y < hgt) { const rh = [1, 1, 2, 1, 2, 1][Math.floor(rnd() * 6)] * U + (rnd() < .3 ? U / 2 : 0); rows.push([y, rh]); y += rh + 4; }
    for (const [ry, rh] of rows) {
      let x = 4;
      while (x < w) {
        const span = Math.max(1, Math.round(1 + rnd() * (rh > U * 1.5 ? 4 : 3)));
        let mw = span * U + (span - 1) * 4; if (x + mw > w - 4) mw = w - 4 - x;
        if (mw < U * 0.6) break;
        const kinds = mw < U * 1.2 ? ['dial', 'knob', 'switch', 'dots', 'meter'] : rh > U * 1.4 ? ['scope', 'dial', 'lcd', 'meter', 'dots', 'knobs', 'patch'] : ['lcd', 'knobs', 'slider', 'switches', 'meter', 'dots', 'plate', 'scope'];
        mods.push({ x, y: ry, w: mw, h: rh, k: kinds[Math.floor(rnd() * kinds.length)], r: rnd(), v: readouts[Math.floor(rnd() * readouts.length)] || '000', word: words[Math.floor(rnd() * words.length)] });
        x += mw + 4;
      }
    }
  }
  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    w = rect.width; hgt = rect.height;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(hgt * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout();
  }
  const line = (x1, y1, x2, y2) => { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
  const circ = (x, y, r, fill) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } ctx.stroke(); };

  function drawMod(m, t) {
    const { x, y, w: mw, h: mh, r } = m;
    ctx.fillStyle = FACE; ctx.fillRect(x, y, mw, mh);
    ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, mw - 1, mh - 1);
    const cx = x + mw / 2, cy = y + mh / 2, pad = 6;
    ctx.lineWidth = 1.2;
    switch (m.k) {
      case 'dial': case 'knob': {
        const R = Math.min(mw, mh) / 2 - pad;
        circ(cx, cy, R, m.k === 'knob' ? FACE : null);
        if (m.k === 'dial') for (let i = 0; i < 9; i++) { const a = Math.PI * (0.75 + i * 0.1875); line(cx + Math.cos(a) * R * .78, cy + Math.sin(a) * R * .78, cx + Math.cos(a) * R * .95, cy + Math.sin(a) * R * .95); }
        const a = Math.PI * (0.8 + 1.4 * (0.5 + 0.45 * Math.sin(t * (0.3 + r) + r * 9)));
        ctx.lineWidth = 2; line(cx, cy, cx + Math.cos(a) * R * .8, cy + Math.sin(a) * R * .8); ctx.lineWidth = 1.2;
        circ(cx, cy, 2, INK);
        break;
      }
      case 'lcd': {
        const sx = x + pad, sy = y + pad, sw = mw - pad * 2, sh = Math.min(mh - pad * 2, 30);
        ctx.fillStyle = SCREEN; ctx.fillRect(sx, sy + (mh - pad * 2 - sh) / 2, sw, sh);
        let txt = m.v;
        if (r < .3) txt = new Date().toLocaleTimeString('en-GB');
        ctx.fillStyle = PH; ctx.font = `700 ${Math.min(20, sh * .66)}px 'Doto', 'Geist Mono', monospace`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillText(txt, sx + sw - 6, sy + (mh - pad * 2) / 2 + 1, sw - 10);
        break;
      }
      case 'scope': {
        const sx = x + pad, sy = y + pad, sw = mw - pad * 2, sh = mh - pad * 2;
        ctx.fillStyle = SCREEN; ctx.fillRect(sx, sy, sw, sh);
        ctx.strokeStyle = PHD; ctx.lineWidth = .6;
        for (let i = 1; i < 4; i++) line(sx + (sw * i) / 4, sy, sx + (sw * i) / 4, sy + sh);
        line(sx, sy + sh / 2, sx + sw, sy + sh / 2);
        ctx.strokeStyle = PH; ctx.lineWidth = 1.6; ctx.beginPath();
        for (let i = 0; i <= sw; i += 2) {
          const ph = (i / sw) * Math.PI * (4 + r * 6) + t * (1.5 + r * 2);
          const yy = sy + sh / 2 + Math.sin(ph) * sh * 0.32 * (r < .5 ? 1 : Math.sign(Math.sin(ph)));
          i === 0 ? ctx.moveTo(sx + i, yy) : ctx.lineTo(sx + i, yy);
        }
        ctx.stroke();
        break;
      }
      case 'meter': {
        const n = Math.max(3, Math.floor((mw - pad * 2) / 7));
        for (let i = 0; i < n; i++) {
          const bh = (mh - pad * 2) * (0.25 + 0.7 * Math.abs(Math.sin(t * (1 + r) + i * 0.7 + r * 5)));
          ctx.fillStyle = r < .5 ? PH : INK; ctx.fillRect(x + pad + i * 7, y + mh - pad - bh, 4, bh);
        }
        break;
      }
      case 'knobs': {
        const n = Math.max(2, Math.floor((mw - pad) / 26)); const R = Math.min(9, mh / 4);
        for (let i = 0; i < n; i++) {
          const kx = x + pad + 10 + i * ((mw - pad * 2 - 20) / Math.max(1, n - 1)); circ(kx, cy, R, FACE);
          const a = r * 6 + i * 1.3 + (reduce ? 0 : Math.sin(t * .4 + i) * .4); line(kx, cy, kx + Math.cos(a) * R, cy + Math.sin(a) * R);
        }
        break;
      }
      case 'slider': case 'switches': case 'switch': {
        if (m.k === 'slider') {
          line(x + pad, cy, x + mw - pad, cy);
          const p = x + pad + (mw - pad * 2) * (0.5 + 0.4 * Math.sin(t * .5 + r * 7));
          ctx.fillStyle = INK; ctx.fillRect(p - 4, cy - 7, 8, 14);
          for (let i = 0; i <= 8; i++) line(x + pad + ((mw - pad * 2) * i) / 8, cy + 10, x + pad + ((mw - pad * 2) * i) / 8, cy + 13);
        } else {
          const n = m.k === 'switch' ? 1 : Math.max(2, Math.floor((mw - pad) / 16));
          for (let i = 0; i < n; i++) {
            const sx = x + pad + i * ((mw - pad * 2) / n) + 2, sw = (mw - pad * 2) / n - 6;
            ctx.strokeRect(sx + .5, cy - 9.5, sw, 18);
            const on = Math.sin(r * 40 + i * 2.1 + Math.floor(t / 3)) > 0;
            ctx.fillStyle = on ? PH : INK; ctx.fillRect(sx + 2, on ? cy - 8 : cy, sw - 3, 7);
          }
        }
        break;
      }
      case 'dots': {
        const g = 9, cols = Math.floor((mw - pad * 2) / g), rows = Math.floor((mh - pad * 2) / g);
        for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
          const lit = Math.sin(i * 1.7 + j * 2.3 + r * 30 + Math.floor(t * 1.5) * 0.9) > 0.55;
          ctx.fillStyle = lit ? PH : INK; ctx.beginPath(); ctx.arc(x + pad + 4 + i * g, y + pad + 4 + j * g, lit ? 2.6 : 1.4, 0, Math.PI * 2); ctx.fill();
        }
        break;
      }
      case 'patch': {
        const pts = []; const n = 4;
        for (let i = 0; i < n; i++) for (let j = 0; j < 2; j++) pts.push([x + pad + 10 + i * ((mw - pad * 2 - 20) / (n - 1)), y + pad + 12 + j * (mh - pad * 2 - 24)]);
        pts.forEach(([px, py]) => circ(px, py, 5, FACE));
        ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
        ctx.bezierCurveTo(pts[0][0] + 20, pts[0][1] + mh * .6, pts[5][0] - 20, pts[5][1] + mh * .2, pts[5][0], pts[5][1]); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(pts[2][0], pts[2][1]); ctx.quadraticCurveTo(cx, cy + mh * .4, pts[7][0], pts[7][1]); ctx.stroke(); ctx.lineWidth = 1.2;
        break;
      }
      default: {
        const pw = Math.max(30, Math.min(mw - pad * 2 - 46, 72));
        ctx.fillStyle = INK; ctx.fillRect(x + pad, cy - 9, pw, 18);
        ctx.fillStyle = FACE; ctx.font = "600 10px 'Geist Mono', monospace"; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(m.word, x + pad + 6, cy + 1, pw - 10);
        for (let i = 0; i < 3; i++) circ(x + mw - pad - 8 - i * 14, cy, 4, i === 0 && Math.sin(t * 2 + r * 9) > 0 ? PH : FACE);
      }
    }
  }
  let last = 0, raf = 0;
  function paint(now) {
    const t = reduce ? 0 : now / 1000;
    ctx.fillStyle = WALL; ctx.fillRect(0, 0, w, hgt);
    for (const m of mods) drawMod(m, t);
  }
  function frame(now) {
    if (!document.body.contains(canvas)) return;
    if (now - last > 90) { last = now; paint(now); }
    if (!reduce) raf = requestAnimationFrame(frame);
  }
  size(); paint(performance.now());
  new ResizeObserver(() => { size(); paint(performance.now()); }).observe(canvas);
  if (document.fonts?.ready) document.fonts.ready.then(() => paint(performance.now()));
  cancelAnimationFrame(raf); raf = requestAnimationFrame(frame);
}

/* IMD Tools: app views. */
'use strict';

// ---------- shared data shapes ----------
async function getSeats() {
  if (Data.live) {
    const s = await Data.get('/swarm');
    return Object.values(s.seats || {}).map((x) => ({ ...x, tokenId: String(x.tokenId), last: x.last || x.lastWorkedAt }));
  }
  const s = await Data.get('/seats/records');
  return (s.seats || []).map((x) => ({ ...x, last: x.lastWorkedAt, working: false }));
}
// Seat owners. IMD returns an array; the relay confirms against the seat contract which position is
// which seat (tokenOffset). Without that confirmation, per-seat owners are not shown at all.
async function getOwners() {
  if (!Data.live) return null;
  const o = await Data.get('/seats/owners', 120000);
  const list = (o.owners || []).map((a) => (typeof a === 'string' ? a.toLowerCase() : a?.owner?.toLowerCase() || null));
  const off = Number.isInteger(o.tokenOffset) ? o.tokenOffset : null;
  return {
    list, holders: Number.isFinite(o.holders) ? o.holders : null, verified: off !== null,
    ownerOf: (id) => (off === null ? null : list[Number(id) - off] || null),
    seatsOf: (addr) => (off === null ? null : list.flatMap((a, i) => (a === addr ? [String(i + off)] : []))),
  };
}
// One definition of "working now" everywhere: IMD's own figure.
const workingNow = (h, seats) => (Number.isFinite(h?.workingNow) ? h.workingNow : (seats || []).filter((s) => s.working).length);
async function loadOracleTitles() {
  try { const o = await Data.get('/oracle/requests?limit=200', 60000); rememberOracle(o.requests); } catch {}
}

function snapshotBanner() {
  if (Data.live) return '';
  return `<div class="banner">${ICON.info}<div><b>Preview data.</b> This is a real snapshot of IMD's public data from ${esc(stamp(Data.at))}. Deployed on its own domain, IMD Tools reads the network live and every detail panel fills in.</div></div>`;
}
function sourceChip() {
  const age = (Date.now() - Date.parse(Data.at)) / 1000;
  return Data.live
    ? (age > 180 ? `<span class="pill warn" title="IMD's latest data is ${esc(ago(Data.at))}">Live · delayed</span>` : `<span class="pill good live">Live</span>`)
    : `<span class="pill info">Snapshot<span class="when">&nbsp;· ${esc(stamp(Data.at))}</span></span>`;
}
const loading = (n = 5) => `<div class="panel"><div class="panel-body" style="display:flex;flex-direction:column;gap:14px">${'<div class="skeleton"></div>'.repeat(n)}</div></div>`;
const errorBox = (e) => {
  const why = e?.message === 'snapshot_only' ? 'This detail is only available in the live app.'
    : e?.message === 'timeout' ? 'IMD took too long to answer.'
    : e?.status === 429 ? 'IMD is rate-limiting requests right now.'
    : e?.status >= 500 ? 'IMD had a problem answering.'
    : 'IMD did not answer.';
  return `<div class="panel"><div class="empty"><b>Couldn't load this from IMD.</b><span>${esc(why)} The page retries on its own every few seconds.</span>${e?.path ? `<span class="mono" style="font-size:11.5px">${esc(e.path)} → ${esc(e.status || e.message)}</span>` : ''}<button type="button" class="btn small ghost" data-retry>Try again now</button></div></div>`;
};
const head = (title, sub, right = '') => `<div class="page-head"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${right}</div>`;

        <div class="panel-body">
          <div class="stack" role="img" aria-label="Task outcomes">${[...stateOrder, ...others.map(([k]) => [k, titleCase(k), 'var(--info)'])].filter(([k]) => js[k]).map(([k, l, col]) => `<span style="width:${Math.max(0.4, (js[k] / total) * 100)}%;background:${col}" title="${esc(l)}: ${fmt(js[k])}"></span>`).join('')}</div>
          <div class="legend-list">${[...stateOrder, ...others.map(([k]) => [k, titleCase(k), 'var(--info)'])].map(([k, l, col]) => `<div><i style="background:${col}"></i>${esc(l)}<b>${fmt(js[k] || 0)}</b></div>`).join('')}</div>
          <p class="muted" style="font-size:13px;margin-top:16px">${pct(js.completed || 0, total)}% of all tasks completed. The swarm has spent ${compact(c.inferenceTokens)} tokens of AI inference so far.</p>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Pipeline health</h2>${Data.live ? `<span class="muted" style="font-size:13px">${fmt(working)} seats working</span>` : ''}</div>
        <div class="panel-body" style="display:flex;flex-direction:column;gap:14px">
          <div class="svc">${[['Verifier', h.verifierUp], ['Publisher', h.publisherUp], ['Deployer', h.deployerUp]].map(([n, up]) => `<div><span class="k">${n}</span><span class="pill ${up ? 'good' : 'bad'}">${up ? 'Up' : 'Down'}</span></div>`).join('')}</div>
          <dl class="kv" style="grid-template-columns:minmax(0,1fr) auto">
            <dt>Waiting for verification</dt><dd class="num">${fmt(h.pendingVerification)}</dd>

}
const kpi = (label, value, sub, hot) => `<div class="panel kpi ${hot ? 'hot' : ''}"><span class="label">${label}</span><span class="value">${value}</span><span class="sub">${sub}</span></div>`;

// ================= TASKS =================
const TaskState = { type: 'all', state: 'all', q: '', jobs: [], before: null, more: true, fresh: new Set() };
async function refreshTasks() {
  const params = new URLSearchParams({ limit: '100' });
  if (TaskState.q) params.set('q', TaskState.q.slice(0, 200));
  const r = await Data.get('/jobs?' + params, 8000);
  const byId = new Map(TaskState.jobs.map((j) => [j.id, j]));
  TaskState.fresh = new Set();
  for (const j of r.jobs || []) {
    const prev = byId.get(j.id);
    if (!prev || prev.state !== j.state) TaskState.fresh.add(j.id);
    byId.set(j.id, j);
  }
  TaskState.jobs = [...byId.values()].sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt));
}

    <section class="panel">

const answers = new Map(Object.entries(SNAP.answers || {}));
function answerFor(q) { const a = answers.get(q.id); return a == null ? null : esc(a); }
async function hydrateAnswers(el, reqs) {
  const queue = reqs.filter((q) => !answers.has(q.id));
  const worker = async () => {
    while (queue.length) {
      const q = queue.shift();
      try {
        const a = await Data.get(`/oracle/requests/${q.id}/attestation`, 600000);
        const v = decodeAnswer(a.message?.answerType || q.answerType, a.message?.answer);
        answers.set(q.id, v);
        const n = el.querySelector(`[data-answer="${CSS.escape(q.id)}"]`);
        if (n) { n.textContent = v; n.classList.remove('pending'); }
      } catch {}
    }
  };
  await Promise.all([worker(), worker(), worker()]);
}
function medianDur(reqs) {
  const d = reqs.filter((q) => q.attestedAt).map((q) => Date.parse(q.attestedAt) - Date.parse(q.createdAt)).filter((x) => x > 0).sort((a, b) => a - b);
  if (!d.length) return '—';
  const m = d[Math.floor(d.length / 2)];
  return dur(new Date(0).toISOString(), new Date(m).toISOString());
}

const fmtBytes = (n) => (!Number.isFinite(n) ? '' : n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : n >= 1024 ? `${Math.round(n / 1024)} KB` : `${n} bytes`);
const NODE_STATE = { ...JOB_STATE, accepted: ['Accepted', 'good'], implementing: ['Working', 'accent live'], verifying: ['Verifying', 'info'], ready: ['Queued', 'info'] };
// IMD sometimes answers 503 for a single task or seat for a while. While a panel is open, its reads
// are retried quietly with a growing pause, so the panel fills in by itself once IMD answers.
async function keepTrying(body, load, attempts = 10, onFail) {
  let last;
  for (let i = 0; i < attempts; i++) {
    if (i) { await sleep(Math.min(4000 + i * 2000, 12000)); if (!body.isConnected) throw last; }
    try { return await load(i); } catch (e) { last = e; onFail?.(e); }
  }
  throw last;
}

  const body = openDrawer(`Seat #${id}`, `${seatActions(id)}

  if (!Data.live && String(id) !== '42') return;
  // Each source is read on its own: the live status shows at once, and the seat's full record
  // (recent work, collaborators) is added when IMD returns it. One failing route never blanks the panel.
  // IMD sometimes answers 503 for a seat for a while. While the panel is open, both sources are retried
  // quietly (and the full record also in a lighter form) until IMD answers, so it fills in by itself.
  const tries = [`/seats/${id}?work=8&reviews=0`, `/seats/${id}?work=4&reviews=0`, `/seats/${id}`];
  const persist = (load, attempts, onFail) => keepTrying(body, load, attempts, onFail);
  const detail = persist((i) => Data.get(tries[i % tries.length]), 10, (e) => { if (cur[1] === 'loading' || cur[1]?.retrying) paint(cur[0], { retrying: true, status: e?.status, message: e?.message }); });
  let st = null; let stDone = !Data.live;
  const standing = Data.live ? persist(() => Data.get(`/seats/${id}/standing?queue=0`), 8) : Promise.reject(null);
  const [owners, latest] = await Promise.all([getOwners().catch(() => null), latestWorker()]);
  let cur = [{}, 'loading'];

    const box = body.querySelector('#sd'); if (!box) return;
    // The seat's own record is fresher than IMD's network summary, so its totals win once loaded.
    if (Number.isFinite(f.attempts)) { const k = body.querySelector('#sd-k'); if (k) k.innerHTML = seatKpis(f); }
    const p = st?.presence || {}; const sd = st?.standing || {};
    const owner = isAddr(f.owner) ? f.owner : owners?.ownerOf(id) || null;
    const online = f.online ?? p.connected;
    const rt = (f.runtimes || p.runtimes || []).map((r) => [r.id, r.premiumModel?.model].filter(Boolean).join(' · ')).join(', ');
    box.innerHTML = `
      <dl class="kv">
        <dt>Status</dt><dd>${online == null ? (stDone ? '<span class="pill">Unknown</span>' : '<span class="pill">Checking…</span>') : online ? '<span class="pill good">Online</span>' : '<span class="pill">Offline</span>'}${p.acceptingWork === false ? ' <span class="pill warn">Not taking work</span>' : ''}${sd.pausedUntil ? ` <span class="pill bad">Paused until ${esc(stamp(sd.pausedUntil))}</span>` : ''}${s.working ? ' <span class="pill accent live">Working</span>' : ''}</dd>
        ${isAddr(owner) ? `<dt>Owner</dt><dd><a href="#" data-wallet="${esc(owner)}" class="mono">${esc(short(owner, 8, 6))}</a>${isTreasury(owner) ? ' <span class="tag">Treasury</span>' : ''}</dd>` : ''}
        ${rt ? `<dt>Runs</dt><dd>${esc(rt)}</dd>` : ''}
        ${f.daemonVersion || p.daemonVersion ? `<dt>Agent version</dt><dd><span class="mono">${esc(shortVer(p.daemonVersion || f.daemonVersion))}</span> ${isOlder(p.daemonVersion || f.daemonVersion, latest) ? `<span class="pill warn">Older · latest ${esc(shortVer(latest))}</span>` : latest ? '<span class="pill good">Latest</span>' : ''}</dd>` : ''}
        ${p.lastHeartbeatAt ? `<dt>Last heartbeat</dt><dd>${esc(ago(p.lastHeartbeatAt))}</dd>` : ''}
        ${s.last ? `<dt>Last work</dt><dd>${esc(ago(s.last))}</dd>` : ''}
        ${sd.consecutiveFailures ? `<dt>Failures in a row</dt><dd>${fmt(sd.consecutiveFailures)}</dd>` : ''}
        ${f.collaboratorJobs ? `<dt>Shared jobs</dt><dd>${fmt(f.collaboratorJobs)} with other seats</dd>` : ''}
      </dl>
      ${isOlder(p.daemonVersion || f.daemonVersion, latest) ? `<div class="banner warn">${ICON.info}<div><p><b>This agent runs an older IMD worker.</b> It still takes work, but without the latest fixes.</p>${updateFix(true)}</div></div>` : ''}
      ${state?.retrying ? `<div class="banner">${ICON.info}<div>IMD is slow to return this seat's work history right now${state.status ? ` (${esc(state.status)})` : ''}. Retrying automatically, it fills in here as soon as IMD answers.</div></div>` : ''}
      ${state === 'loading' || state?.retrying ? `<div><div class="sub-h">Recent work</div>${'<div class="skeleton" style="margin-bottom:10px"></div>'.repeat(3)}</div>` : ''}
      ${state && state !== 'loading' && !state.retrying ? `<div class="banner">${ICON.info}<div>IMD isn't returning this seat's work history right now${state.status ? ` (${esc(state.status)})` : ''}. Everything above is current. <a href="#" data-open-seat="${esc(id)}">Try again</a></div></div>` : ''}
      ${(f.work || []).length ? `<div><div class="sub-h">Recent work</div><div class="contracts">${f.work.map((w) => `<a href="#" data-open-job="${esc(w.jobId)}"><span class="nm"><span>${esc(jobTitle({ id: w.jobId, objective: w.objective }))}</span></span>${statePill(w.status, { accepted: ['Accepted', 'good'], rejected: ['Rejected', 'bad'], pending: ['Pending', 'info'], failed: ['Failed', 'bad'] })}</a>`).join('')}</div></div>` : ''}
      ${(f.collaborators || []).length ? `<div><div class="sub-h">Works most with</div><div class="chips">${f.collaborators.slice(0, 6).map((c) => `<button type="button" class="chip" data-open-seat="${esc(c.tokenId)}">#${esc(c.tokenId)}<span class="n">${fmt(c.sharedJobs)}</span></button>`).join('')}</div></div>` : ''}`;
  };
  paint({}, 'loading');
  standing.then((v) => { st = v; }, () => {}).finally(() => { stDone = true; paint(...cur); });
  detail.then((f) => paint(f || {}, null), (e) => paint({}, e));
}

/* IMD Tools: shared network helpers. Latest worker release, per-seat records, update instructions. */
'use strict';

// The newest IMD worker release (e.g. 0.1.0+986b9f58), read by the relay from the worker repository.
async function latestWorker() {
  if (!Data.live) return null;
  try { return (await Data.get('/worker/latest', 300000))?.daemonVersion || null; } catch { return null; }
}
const shortVer = (v) => String(v || '').replace(/^0\.1\.0\+/, '');
const isOlder = (v, latest) => !!(v && latest && v !== latest);

// Resolves to the value, or to `fallback` if it takes longer than `ms`. The request itself keeps going
// and lands in the cache, so the next refresh has it.
const within = (p, ms, fallback = null) => Promise.race([p, new Promise((r) => setTimeout(() => r(fallback), ms))]);
// One seat's full record from IMD: totals, recent work and who it works with. Null when IMD is slow.
async function seatRecord(id, work = 6) {
  try { return await Data.get(`/seats/${id}?work=${work}&reviews=0`, 60000); } catch { return null; }
}
async function seatStanding(id, queue = false) {
  try { return await Data.get(`/seats/${id}/standing${queue ? '' : '?queue=0'}`, 30000); } catch (e) { if (e?.status === 404) return { notFound: true }; return null; }
}
// Approval: accepted out of everything that has been decided (accepted + rejected).
const approval = (acc, rej) => (acc + rej ? Math.round((acc / (acc + rej)) * 1000) / 10 : null);
const teammates = (n) => (n ? `${fmt(n)}${n >= 200 ? '+' : ''}` : '—');

// The fix for an agent on an older worker, with copyable commands.
function updateFix(compact = false) {
  return `<div class="fix${compact ? ' compact' : ''}">
    <span class="fix-step"><i>1</i>On the agent's machine, run ${copyBtn('imd update')}</span>
    <span class="fix-step"><i>2</i>Restart the agent: ${copyBtn('imd service restart')}</span>

/* ---------- check a seat ---------- */
// One seat, one checklist: is it paired, registered, online, taking work and up to date, with the fix

const FOUNDRY_CMD = 'curl -L https://foundry.paradigm.xyz | bash && foundryup';
async function viewCheck(el, id) {
  id = String(id ?? store.get('check') ?? '').trim().replace(/^#/, '');

  if (!Data.live) { out.innerHTML = `<div class="panel"><div class="empty"><b>Seat checks run on the live site.</b><span>They read the seat's status from IMD as it is right now.</span></div></div>`; return; }

function checkReport(id, st, rec, latest, owners) {
  const e = st.enrollment || {}, p = st.presence || {}, sd = st.standing || {}, c = st.contract || {}, q = st.queue || {};
  const paired = e.status === 'active' || !!e.pairedAt;
  const online = !!p.connected && !p.stale;
  const paused = sd.pausedUntil && Date.parse(sd.pausedUntil) > Date.now();
  const ver = p.daemonVersion || rec?.daemonVersion || null;
  const reg = safeUrl(e.registerUrl);
  const steps = [
    { ok: paired, t: 'Paired with a worker', good: e.pairedAt ? `paired ${ago(e.pairedAt)}` : 'paired',
      bad: 'No worker is paired with this seat yet.',
      fix: `<span class="fix-step"><i>1</i>Install the IMD worker on a Linux VPS (or a computer that stays on), following ${extLink(WORKER_REPO + '#install', 'the install guide')}</span><span class="fix-step"><i>2</i>Start it: ${copyBtn('imd start --auto-update')} and pair it with the wallet that holds seat #${esc(id)}</span>` },
    { ok: !!e.registered, t: 'Registered as an agent', good: e.agentId ? `agent ${e.agentId}` : 'registered on-chain',
      bad: 'The seat is not registered as an agent yet, so it can\'t connect for work.',
      fix: reg ? `<span class="fix-step"><i>1</i><a class="btn small" href="${esc(reg)}" target="_blank" rel="noopener">Register seat #${esc(id)} on IMD ↗</a></span><span class="fix-step"><i>2</i>Confirm the transaction with the wallet that holds the seat. The NFT stays in your wallet.</span>` : `<span class="fix-step"><i>1</i>Run ${copyBtn('imd start --auto-update')}; the first start shows the registration link.</span>`, dep: 0 },
    { ok: online, t: 'Online', good: p.lastHeartbeatAt ? `checked in ${ago(p.lastHeartbeatAt)}` : 'connected',
      bad: p.lastHeartbeatAt ? `Last seen ${ago(p.lastHeartbeatAt)}. The worker isn't connected right now.` : 'The worker isn\'t connected.',
      fix: `<span class="fix-step"><i>1</i>On the agent's machine, check it: ${copyBtn('imd service status')}</span><span class="fix-step"><i>2</i>Start it again: ${copyBtn('imd service start')} (or ${copyBtn('imd start --auto-update')})</span>`, dep: 1 },
    { ok: online && p.acceptingWork !== false && !paused, t: 'Taking work', good: (sd.running || []).length ? 'working on a job right now' : 'ready for the next job',
      bad: paused ? `Paused until ${stamp(sd.pausedUntil)}${sd.pausedFor ? ` (${String(sd.pausedFor).replace(/_/g, ' ')})` : ''} after failed jobs.` : 'The worker is online but not taking work.',
      fix: `<span class="fix-step"><i>1</i>See why in the agent's log: ${copyBtn('imd service logs -f')}</span><span class="fix-step"><i>2</i>${paused ? 'The pause lifts on its own. If jobs keep failing, run ' + copyBtn('imd doctor') : 'Run ' + copyBtn('imd doctor') + ' to see what it is waiting for'}</span>`, dep: 2 },
    { ok: !!ver && !isOlder(ver, latest), t: 'Up to date', good: ver ? `worker ${shortVer(ver)}${latest ? ' · latest' : ''}` : '',
      bad: ver ? `Runs worker ${shortVer(ver)}; the latest is ${shortVer(latest)}. It still works, without the latest fixes.` : 'Version unknown until the worker connects.',
      fix: `<span class="fix-step"><i>1</i>On the agent's machine, run ${copyBtn('imd update')}</span><span class="fix-step"><i>2</i>Restart the agent: ${copyBtn('imd service restart')}</span>`, dep: 2 },
    { ok: !!c.qualifies, opt: true, t: 'Contract & website jobs', good: 'qualifies for contract and website build jobs',
      bad: (c.missing || []).length ? `Optional: also needs ${c.missing.join(', ')} for contract and website jobs.` : 'Optional: not set up for contract and website jobs.',
      fix: (c.missing || []).includes('foundry') ? `<span class="fix-step"><i>1</i>Install Foundry on the agent's machine: ${copyBtn(FOUNDRY_CMD)}</span><span class="fix-step"><i>2</i>Restart the agent: ${copyBtn('imd service restart')}</span>` : `<span class="fix-step"><i>1</i>Run ${copyBtn('imd doctor')} to see what is missing.</span>`, dep: 1 },
  ];
  // A step that depends on an earlier failed one is shown as waiting, not as a separate problem.
  steps.forEach((s, i) => { s.wait = !s.ok && s.dep != null && !steps[s.dep].ok; });
  const issues = steps.filter((s) => !s.ok && !s.wait && !s.opt).length;
  const owner = isAddr(rec?.owner) ? rec.owner : owners?.ownerOf(id) || null;
  const ap = rec ? approval(rec.accepted || 0, rec.rejected || 0) : null;
  const rt = (p.runtimes || rec?.runtimes || [])[0];
  return `<div class="check">
    <section class="panel check-head ${issues ? 'has-issues' : 'all-good'}">
      <div class="ch-id"><img src="${IMD_API}/agents/by-token/${esc(id)}.svg" alt="" width="56" height="56" onerror="this.style.visibility='hidden'">
        <div><b>IMD #${esc(id)}</b><span>${e.agentId || rec?.agentId ? `agent ${esc(e.agentId || rec.agentId)}` : 'no agent yet'}${owner ? ` · owner <a href="#" data-wallet="${esc(owner)}" class="mono">${esc(short(owner))}</a>${isTreasury(owner) ? ' <span class="tag">Treasury</span>' : ''}` : ''}</span></div></div>
      <div class="ch-verdict"><span class="ch-led"></span><div><b>${issues ? `${issues} thing${issues === 1 ? '' : 's'} to fix` : 'All set'}</b><span>${issues ? 'Work through the steps below in order.' : (sd.running || []).length ? 'Online and working on a job right now.' : 'Online, up to date and ready for work.'}</span></div></div>
      <div class="ch-stats">
        <span><i>Accepted</i><b>${rec ? fmt(rec.accepted || 0) : '—'}</b></span><span><i>Approval</i><b>${ap == null ? '—' : ap + '%'}</b></span>
        <span><i>Tasks it can take</i><b>${Number.isFinite(q.eligible) ? fmt(q.eligible) : '—'}</b></span><span><i>Model</i><b class="sm">${esc(rt?.premiumModel?.model || rt?.model || rt?.id || '—')}</b></span>
      </div>
    </section>
    <ol class="steps-check">${steps.map((s, i) => `<li class="${s.ok ? 'ok' : s.wait ? 'wait' : s.opt ? 'opt' : 'bad'}">
      <span class="sc-ico">${s.ok ? ICON.ok : s.wait ? ICON.info : s.opt ? ICON.info : ICON.no}</span>
      <div class="sc-body"><div class="sc-t"><b>${String(i + 1).padStart(2, '0')} · ${s.t}</b><span>${esc(s.ok ? s.good : s.wait ? 'waits on the step above' : s.bad)}</span></div>
      ${!s.ok && !s.wait ? `<div class="fix">${s.fix}</div>` : ''}</div></li>`).join('')}</ol>
    ${(q.blocked || []).length ? `<div class="banner">${ICON.info}<div><b>Why some tasks pass this seat by:</b> ${q.blocked.map((b) => `${esc(b.reason)} (${fmt(b.nodes)})`).join(' · ')}</div></div>` : ''}
    <div class="check-foot"><button type="button" class="btn small ghost" data-open-seat="${esc(id)}">Open seat #${esc(id)} →</button><a href="#" id="check-again" class="muted">Check again</a><span class="muted">Read from IMD just now. Commands run on the agent's machine.</span></div>
  </div>`;
}

/* ---------- holder calculator ---------- */
function holderCalc(m) {
  const seats = m?.seats?.length || 0;
  const acc = (m?.seats || []).reduce((a, s) => a + (Number(s.accepted) || 0), 0);
  return `<section class="panel calc" data-seats="${seats}" data-acc="${acc}">
    <div class="panel-head"><h2>Holder calculator</h2><span class="muted" style="font-size:12px">What your ${esc(TICKER())} represents</span></div>
    <div class="panel-body">
      <form class="calc-in" onsubmit="return false"><label for="calc-amt" class="cap">Your ${esc(TICKER())}</label>
        <div class="search"><input id="calc-amt" type="text" inputmode="decimal" placeholder="e.g. 5,000,000" autocomplete="off"></div>
        <div class="chips">${[1e6, 5e6, 1e7, 2.5e7].map((v) => `<button type="button" class="chip" data-amt="${v}">${compact(v)}</button>`).join('')}</div>
      </form>
      <div class="calc-out" id="calc-out">${calcOut(0, seats, acc)}</div>
      <p class="muted" style="font-size:12px">A proportional view of the treasury, for illustration. It is not a claim on any seat or payout, and not financial advice.</p>
    </div>
  </section>`;
}
function calcOut(amt, seats, acc) {
  const share = amt > 0 ? amt / CONFIG.totalSupply : 0;
  const pctStr = share ? (share * 100 < 0.01 ? '<0.01' : (share * 100).toFixed(share * 100 < 1 ? 3 : 2)) + '%' : '—';
  const cells = [
    ['Share of supply', pctStr, `of ${compact(CONFIG.totalSupply)} ${esc(TICKER())}`],
    ['Share of the seats', share ? (seats * share).toFixed(4) : '—', `of the treasury's ${fmt(seats)} seat${seats === 1 ? '' : 's'}`],
    ['Share of the work', share ? (acc * share).toFixed(2) : '—', `of ${fmt(acc)} accepted jobs so far`],
  ];
  return cells.map(([l, v, s]) => `<div class="calc-cell"><span class="cap">${l}</span><b>${v}</b><span>${s}</span></div>`).join('')
    + `<div class="calc-bar" aria-hidden="true"><i style="width:${Math.min(100, Math.max(share ? 0.6 : 0, share * 100 * 20))}%"></i></div>`;
}
function bindHolderCalc(root) {
  const box = root.querySelector('.calc'); if (!box) return;
  const seats = Number(box.dataset.seats) || 0, acc = Number(box.dataset.acc) || 0;
  const inp = box.querySelector('#calc-amt'), out = box.querySelector('#calc-out');
  const saved = store.get('calc'); if (saved) inp.value = saved;
  const upd = () => { const v = Number(String(inp.value).replace(/[^0-9.]/g, '')) || 0; out.innerHTML = calcOut(Math.min(v, CONFIG.totalSupply), seats, acc); store.set('calc', inp.value); };
  inp.addEventListener('input', upd);
  box.querySelectorAll('[data-amt]').forEach((b) => b.addEventListener('click', () => { inp.value = fmt(Number(b.dataset.amt)); upd(); }));
  upd();
}

      ${ids.length < COMPARE_MAX ? `<div class="search" style="max-width:260px"><label class="sr" for="cmp-in">Add a seat</label>${ICON.seats}<input id="cmp-in" type="text" inputmode="numeric" placeholder="Add a seat number" autocomplete="off"></div><button class="btn" type="submit">Add</button>` : '<span class="muted" style="font-size:12px">Four seats is the maximum. Remove one to add another.</span>'}
      <span class="links" style="margin-left:auto"><a href="#" id="cmp-tre">Treasury seats</a><a href="#" id="cmp-share">${ICON.copy}Copy link</a><a href="#" id="cmp-img">${ICON.doc}Save image</a></span>
    </form>
    <div id="cmp-out">${loading(5)}</div>`;
  el.querySelector('#cmp-form').addEventListener('submit', (e) => { e.preventDefault(); const v = parse(el.querySelector('#cmp-in')?.value); if (v.length) go(parse([...ids, ...v].join(','))); });
  el.querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', () => { const n = ids.filter((x) => x !== b.dataset.rm); go(n.length ? n : ['461']); }));
  el.querySelector('#cmp-tre').addEventListener('click', (e) => { e.preventDefault(); go(['461', '690', '1061', '1016']); });
  el.querySelector('#cmp-img').addEventListener('click', (e) => e.preventDefault());
  el.querySelector('#cmp-share').addEventListener('click', (e) => { e.preventDefault(); copyText(`https://www.imdtools.fun/#compare/${ids.join(',')}`, 'Link copied'); });

  const out = el.querySelector('#cmp-out');
  const all = await getSeats().catch(() => []);
  const [recs, sts, t] = await Promise.all([
    Promise.all(ids.map((id) => within(seatRecord(id, 1), 3000))),
    Data.live ? Promise.all(ids.map((id) => within(seatStanding(id), 3000))) : ids.map(() => null),
    within(getTreasury().catch(() => null), 3000),
  ]);
  if (!out.isConnected) return;
  const ours = new Set((t?.seats || []).map(String));
  const byId = new Map(all.map((s) => [String(s.tokenId), s]));
  const seats = ids.map((id, i) => {
    const s = { ...(byId.get(id) || {}), tokenId: id }; const r = recs[i];
    if (r) for (const k of ['attempts', 'accepted', 'rejected', 'failed', 'pending']) if (Number.isFinite(r[k])) s[k] = r[k];
    const p = sts[i]?.presence;
    s.state = p ? (p.connected && !p.stale ? ((sts[i].standing?.working || 0) > 0 ? 'Working' : 'Online') : 'Offline') : (s.working ? 'Working' : null);
    s.agentId = s.agentId || r?.agentId || sts[i]?.enrollment?.agentId || null;
    s.ours = ours.has(id); s.known = !!(r || byId.has(id));
    return s;
  });
  // The network: every seat that has done work.
  const active = all.filter((s) => (s.attempts || 0) > 0);
  const sum = (k) => active.reduce((a, s) => a + (Number(s[k]) || 0), 0);
  const net = { accepted: active.length ? sum('accepted') / active.length : null, attempts: active.length ? sum('attempts') / active.length : null, rejected: active.length ? sum('rejected') / active.length : null, ap: approval(sum('accepted'), sum('rejected')) };
  const sortedAcc = active.map((s) => s.accepted || 0).sort((a, b) => b - a);
  const rankOf = (v) => (v == null ? null : sortedAcc.findIndex((x) => x <= v) + 1 || sortedAcc.length + 1);
  const cols = seats.map((s) => ({ ...s, ap: approval(s.accepted || 0, s.rejected || 0), rank: s.attempts ? rankOf(s.accepted || 0) : null }));
  const ROWS = [
    ['Status', (s) => s.state || '—', null],
    ['Rank by accepted work', (s) => (s.rank ? `#${fmt(s.rank)}` : '—'), (s) => (s.rank ? -s.rank : null), active.length ? `of ${fmt(active.length)}` : ''],
    ['Accepted', (s) => fmt(s.accepted || 0), (s) => s.accepted || 0, net.accepted == null ? '' : fmt(Math.round(net.accepted))],
    ['Approval', (s) => (s.ap == null ? '—' : `${s.ap}%`), (s) => s.ap, net.ap == null ? '' : `${net.ap}%`],
    ['Attempts', (s) => fmt(s.attempts || 0), (s) => s.attempts || 0, net.attempts == null ? '' : fmt(Math.round(net.attempts))],
    ['Rejected', (s) => fmt(s.rejected || 0), (s) => -(s.rejected || 0), net.rejected == null ? '' : (Math.round(net.rejected * 10) / 10).toString()],
    ['Awaiting review', (s) => fmt(s.pending || 0), null],
    ['Last work', (s) => (s.last ? ago(s.last) : '—'), null],
  ];
  const best = ROWS.map(([, , score]) => { if (!score) return null; const v = cols.map(score).filter((x) => x != null); return v.length > 1 ? Math.max(...v) : null; });
  window.__cmpModel = { cols, active: active.length, rows: ROWS.filter(([l]) => l !== 'Awaiting review' && l !== 'Last work').map(([label, show, score, netv]) => { const ri = ROWS.findIndex((r) => r[0] === label); return { label, net: netv || '', vals: cols.map(show), top: cols.map((s) => score && best[ri] != null && score(s) === best[ri]) }; }) };
  el.querySelector('#cmp-img').onclick = (e) => { e.preventDefault(); downloadCanvas(drawCompareCard(window.__cmpModel), `imd-compare-${ids.join('-')}.png`); };
  const vsNet = (s) => { if (s.ap == null || net.ap == null) return ''; const d = Math.round((s.ap - net.ap) * 10) / 10; return `<span class="cmp-vs ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : ''}${d} pts vs network</span>`; };
  out.innerHTML = `<section class="panel cmp"><div class="table-wrap"><table class="cmp-t">
    <thead><tr><th></th>${cols.map((s) => `<th><button type="button" class="cmp-head" data-open-seat="${esc(s.tokenId)}"><img src="${IMD_API}/agents/by-token/${esc(s.tokenId)}.svg" alt="" width="44" height="44" onerror="this.style.visibility='hidden'"><span><b>IMD #${esc(s.tokenId)}</b><span>${s.agentId ? `agent ${esc(s.agentId)}` : s.known ? 'seat' : 'no record'}</span>${s.ours ? '<i class="tag cmp-tre">Treasury</i>' : ''}</span></span></button></th>`).join('')}<th class="cmp-net">Network average</th></tr></thead>
    <tbody>${ROWS.map(([label, show, score, netv], ri) => `<tr><th scope="row">${label}</th>${cols.map((s) => { const v = score ? score(s) : null; const top = best[ri] != null && v === best[ri]; const st = ri === 0 ? ` class="st-${String(s.state || '').toLowerCase()}"` : ''; return `<td${top ? ' class="top"' : st}>${esc(show(s))}${ri === 3 ? vsNet(s) : ''}</td>`; }).join('')}<td class="cmp-net">${esc(netv || '')}</td></tr>`).join('')}</tbody>
  </table></div></section>
  <p class="muted" style="font-size:12px">Totals are all-time, from IMD. Approval is accepted work out of everything reviewed. Network average covers the ${fmt(active.length)} seats that have done work. Highlighted cells are the best of the seats compared.</p>`;
}

/* ---------- keyboard: / jump to a seat or page, ? shortcuts, g + letter to go ---------- */
const GO_KEYS = { h: ['home', 'Home'], o: ['overview', 'Overview'], e: ['ecosystem', 'Ecosystem'], a: ['agents', 'Agents'], s: ['seats', 'Seats'], c: ['compare', 'Compare seats'], k: ['check', 'Check a seat'], t: ['treasury', 'Treasury'], n: ['tokenomics', 'Tokenomics'], w: ['wallet', 'My wallet'] };
function closeQuick() { document.querySelectorAll('.qj, .qj-scrim').forEach((n) => n.remove()); }
function openQuick(help = false) {
  closeQuick(); closeDrawer();
  const pages = NAV.flatMap(([, i]) => i);
  const scrim = document.createElement('div'); scrim.className = 'qj-scrim'; scrim.addEventListener('click', closeQuick);
  const d = document.createElement('div'); d.className = 'qj'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-label', 'Quick jump');
  d.innerHTML = `<form class="qj-f"><span class="qj-p">&gt;</span><input id="qj-in" type="text" autocomplete="off" spellcheck="false" placeholder="Seat number, or a page (treasury, agents…)" aria-label="Seat number or page"><kbd>esc</kbd></form>
    <div class="qj-list" id="qj-list"></div>
    <div class="qj-keys"><span><kbd>/</kbd> jump</span>${Object.entries(GO_KEYS).map(([k, [, l]]) => `<span><kbd>g</kbd><kbd>${k}</kbd> ${l}</span>`).join('')}<span><kbd>?</kbd> this list</span></div>`;
  document.body.append(scrim, d);
  const inp = d.querySelector('#qj-in'), list = d.querySelector('#qj-list');
  let items = []; let sel = 0;
  const paint = () => {
    const q = inp.value.trim().toLowerCase().replace(/^#/, '');
    items = [];
    if (/^\d{1,5}$/.test(q)) items.push([`seat/${q}`, `Open seat #${q}`], [`check/${q}`, `Check seat #${q}`], [`compare/${[q, ...TREASURY_SEATS.filter((x) => x !== q)].slice(0, 4).join(',')}`, `Compare #${q} with the treasury seats`]);
    else items = pages.filter(([r, l]) => !q || l.toLowerCase().includes(q) || r.includes(q)).slice(0, 7).map(([r, l]) => [r, l]);
    sel = Math.min(sel, Math.max(0, items.length - 1));
    list.innerHTML = items.length ? items.map(([h, l], i) => `<a href="#${h}" class="${i === sel ? 'on' : ''}">${esc(l)}<span>#${esc(h)}</span></a>`).join('') : '<p class="muted">Nothing matches. Type a seat number or a page name.</p>';
  };
  inp.addEventListener('input', () => { sel = 0; paint(); });
  inp.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % Math.max(1, items.length); paint(); } });
  d.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); const it = items[sel]; if (it) { closeQuick(); location.hash = it[0]; } });
  list.addEventListener('click', (e) => { if (e.target.closest('a')) closeQuick(); });
  d.classList.toggle('help', help);
  paint(); inp.focus();
}
let goPending = 0;
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.querySelector('.qj')) { closeQuick(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('input, textarea, select, [contenteditable="true"]')) return;
  if (e.key === '/') { e.preventDefault(); openQuick(); return; }
  if (e.key === '?') { e.preventDefault(); openQuick(true); return; }
  if (e.key === 'g') { goPending = Date.now(); return; }
  if (goPending && Date.now() - goPending < 1200 && GO_KEYS[e.key]) { e.preventDefault(); goPending = 0; closeDrawer(); location.hash = GO_KEYS[e.key][0]; return; }
  goPending = 0;
});

  const e = await Data.get(`/wallets/${CONFIG.treasury.toLowerCase()}/earnings?limit=100`, 60000);

  return { payouts: Number.isFinite(e.count) ? e.count : list.length, more: !Number.isFinite(e.count) && !!e.next, launches: new Set(list.map((x) => x.launchNumber)).size, last: list[0]?.at || null };
}

/* ---------- treasury: where the tax goes ---------- */
// The treasury cycle as a flywheel: six steps on a ring, a pulse orbiting it, and the matching step
// in the list lighting up as the pulse passes. Pure CSS animation, so it costs nothing to run.
function treasurySteps() {
  const T = esc(TICKER());
  return [
    ['swap', 'Trade', `${T} is bought or sold`],
    ['pct', `${esc(CONFIG.taxPercent)}% tax`, 'goes to the treasury wallet'],
    ['seats', 'Seats', 'the treasury buys IMD seat NFTs'],
    ['agents', 'AI agents', 'each seat is registered as an agent on IMD'],
    ['tokenomics', 'IMD earned', 'agents earn IMD for accepted work'],
    ['holders', 'Holders', `IMD goes to ${T} holders periodically`],
  ];
}
function treasuryFlow() {
  const steps = treasurySteps(), n = steps.length;
  const node = ([ic, t], i) => {
    const a = (-90 + i * (360 / n)) * Math.PI / 180;
    const x = (50 + 41 * Math.cos(a)).toFixed(2), y = (50 + 41 * Math.sin(a)).toFixed(2);
    return `<span class="wnode${i === n - 1 ? ' end' : ''}" style="--i:${i};left:${x}%;top:${y}%" title="${t}">${ICON[ic]}<i>${String(i + 1).padStart(2, '0')}</i></span>`;
  };
  return `
    <div class="wheel" aria-label="How the treasury is funded and spent">
      <div class="wheel-ring" aria-hidden="true">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="41" class="ring"/><circle cx="50" cy="50" r="33" class="ring2"/></svg>
        <span class="orbit"><span class="orbit-dot"></span></span>
        <span class="hub"><span class="hub-glyph">${LOGO}</span><b>Treasury</b><span>${esc(CONFIG.taxPercent)}% of every trade</span></span>
        ${steps.map(node).join('')}
      </div>
      <ol class="wsteps">${steps.map(([, t, d], i) => `
        <li class="wstep${i === n - 1 ? ' end' : ''}" style="--i:${i}"><span class="wn">${String(i + 1).padStart(2, '0')}</span><span class="wt"><b>${t}</b><span>${d}</span>${i === n - 1 ? '<em>No staking needed</em>' : ''}</span></li>`).join('')}
      </ol>
    </div>
    <div class="tflow-loop"><span class="dot"></span>Repeats with every ${esc(TICKER())} trade</div>`;
}

async function treasuryModel() {
  const [t, earned] = await Promise.all([getTreasury().catch((e) => ({ error: e })), getTreasuryEarnings().catch(() => null)]);
  if (!t || t.error) return { t, seats: [], earned };
  const all = await getSeats().catch(() => []);
  const byId = new Map(all.map((s) => [String(s.tokenId), s]));
  const seats = (t.seats || []).map((id) => ({ ...(byId.get(String(id)) || { tokenId: String(id), attempts: 0, accepted: 0, rejected: 0, failed: 0, pending: 0 }) }));
  // Live presence and the full record for each treasury seat: online, working, what it is doing and how it scores.
  const [latest] = await Promise.all([within(latestWorker(), 2000), ...seats.map(async (s) => {
    const [st, rec] = await Promise.all([seatStanding(s.tokenId), within(seatRecord(s.tokenId), 2000)]);
    if (rec && !rec.notFound) {
      for (const k of ['attempts', 'accepted', 'rejected', 'failed', 'pending']) if (Number.isFinite(rec[k])) s[k] = rec[k];
      s.agentId = s.agentId || rec.agentId || null;
      s.work = (rec.work || []).map((w) => ({ ...w, tokenId: s.tokenId }));
      s.team = (rec.collaborators || []).length;
      s.version = rec.daemonVersion || null;
      const times = s.work.map((w) => Date.parse(w.acceptedAt || w.submittedAt)).filter(Number.isFinite);
      if (times.length) s.last = new Date(Math.max(...times)).toISOString();
      s.recordKnown = true;
    }
    if (!st || st.notFound) return;
    const p = st.presence || {}, e = st.enrollment || {}, d = st.standing || {};
    s.agentId = s.agentId || e.agentId || null;
    s.registered = !!e.registered;
    s.online = !!p.connected && !p.stale;
    s.accepting = p.acceptingWork !== false;
    s.heartbeat = p.lastHeartbeatAt || null;
    s.runtime = (p.runtimes || [])[0]?.id || null;
    s.model = (p.runtimes || [])[0]?.premiumModel?.model || null;
    s.version = p.daemonVersion || s.version;
    s.running = d.running || [];
    s.liveWorking = (d.working || 0) > 0 || s.running.length > 0;
    s.presenceKnown = true;

  for (const s of seats) s.older = isOlder(s.version, latest);
  return { t, seats, earned };
}

function seatState(s) {

    if (s.online) return ['online', 'Online', s.accepting ? 'accepting jobs' : 'not taking jobs'];
    return ['offline', s.registered ? 'Offline' : 'Not registered', s.registered ? 'registered · worker not connected' : 'waiting for setup'];

  if (s.working) return ['working', 'Working', 'on a job right now'];
  if (s.presenceKnown && s.online) return ['online', 'Online', s.accepting ? 'accepting jobs' : 'not taking jobs'];
  if (s.presenceKnown && s.registered) return ['offline', 'Offline', 'registered · worker not connected'];

/* IMD Tools: live agents. Every agent connected to IMD, its presence, version, model and track record,
   plus a network stats strip and a leaderboard of every seat's accepted work.
   Presence comes from IMD's /workers list, track record from /contributors and /swarm, joined per seat. */
'use strict';

const AgentView = { tab: 'live', filter: 'all', q: '', show: 100, sort: 'accepted', lbShow: 50 };
const HEARTBEAT_STALE_MS = 120000; // IMD's own presence window

async function getAgents() {
  const [w, c, latest] = await Promise.all([Data.get('/workers', 10000), Data.get('/contributors', 30000).catch(() => ({ contributors: [] })), within(latestWorker(), 2500)]);
  const byDev = new Map(); const bySeat = new Map();
  for (const x of c.contributors || []) { byDev.set(x.deviceKey, x); if (x.tokenId) bySeat.set(String(x.tokenId), x); }
  const now = Date.now();
  const list = (w.workers || []).map((x) => {
    const tokenId = x.seat?.tokenId != null ? String(x.seat.tokenId) : null;
    const k = byDev.get(x.deviceKey) || (tokenId && bySeat.get(tokenId)) || {};
    const hb = Date.parse(x.lastHeartbeatAt);
    const rt = (x.runtimes || [])[0] || {};
    return {
      tokenId, agentId: x.seat?.agentId || null, working: (x.working || 0) > 0, paused: !!x.paused,
      stale: !(now - hb < HEARTBEAT_STALE_MS), version: x.daemonVersion || '', connectedAt: x.connectedAt, heartbeat: x.lastHeartbeatAt,
      model: rt.model || rt.premiumModel?.model || '', runtime: rt.id || '', wallet: isAddr(k.wallet) ? k.wallet.toLowerCase() : null,
      attempts: Number(k.attempts) || 0, accepted: Number(k.accepted) || 0, rejected: Number(k.rejected) || 0, turns: Number(k.turns) || 0,
      workMs: Number(k.wallClockMs) || 0, os: x.platform?.os || null,
    };
  });
  // "Current" version: the latest worker release. If it can't be read, the one most connected agents run.
  const counts = new Map(); for (const a of list) if (a.version) counts.set(a.version, (counts.get(a.version) || 0) + 1);
  const current = latest || [...counts.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || '';
  for (const a of list) a.outdated = !!current && !!a.version && a.version !== current;
  return { list, current, fromRelease: !!latest, count: w.count ?? list.length };
}

      ${mTotal ? `<span class="ns-bar" aria-hidden="true">${shown.map(([, n], i) => `<i class="m${i}" style="width:${(n / mTotal) * 100}%"></i>`).join('')}${rest > 0 ? `<i class="m3" style="width:${(rest / mTotal) * 100}%"></i>` : ''}</span>

/* ---------- leaderboard ---------- */
async function getLeaderboard() {
  const [seats, owners, t] = await Promise.all([getSeats().catch(() => []), getOwners().catch(() => null), getTreasury().catch(() => null)]);
  const ours = new Set((t?.seats || []).map(String));
  const map = new Map(seats.map((s) => [String(s.tokenId), { ...s, tokenId: String(s.tokenId) }]));
  // Treasury seats are read in full, so they are ranked on their latest numbers even if IMD's summary lags.
  await Promise.all([...ours].map(async (id) => {
    const r = await within(seatRecord(id), 2500); if (!r) return;
    const s = map.get(id) || { tokenId: id };
    for (const k of ['attempts', 'accepted', 'rejected', 'failed', 'pending']) if (Number.isFinite(r[k])) s[k] = Math.max(Number(s[k]) || 0, r[k]);
    s.agentId = s.agentId || r.agentId; map.set(id, s);
  }));
  const rows = [...map.values()].filter((s) => (s.attempts || 0) > 0).map((s) => ({
    ...s, accepted: s.accepted || 0, rejected: s.rejected || 0, attempts: s.attempts || 0,
    ap: approval(s.accepted || 0, s.rejected || 0), ours: ours.has(s.tokenId), owner: owners?.ownerOf(s.tokenId) || null,
  }));
  return { rows, ours };
}
function rankRows(rows, sort) {
  const by = {
    accepted: (a, b) => b.accepted - a.accepted || (b.ap ?? 0) - (a.ap ?? 0),
    approval: (a, b) => (b.ap ?? -1) - (a.ap ?? -1) || b.accepted - a.accepted,
    attempts: (a, b) => b.attempts - a.attempts || b.accepted - a.accepted,
  }[sort] || ((a, b) => b.accepted - a.accepted);
  // Approval rankings only count seats with enough reviewed work to mean something.
  const pool = sort === 'approval' ? rows.filter((r) => r.accepted + r.rejected >= 20) : rows;
  return [...pool].sort(by).map((r, i) => ({ ...r, rank: i + 1 }));
}

/* ---------- page ---------- */
async function viewAgents(el) {
  if (!Data.live) {
    el.innerHTML = `${head('Agents', AGENTS_INTRO)}
      <div class="panel"><div class="empty"><b>Live agent status loads on the live site.</b><span>Agent presence changes every few seconds, so this page only shows live data.</span></div></div>`;
    return;
  }
  let d;
  try { d = await getAgents(); } catch (e) { el.innerHTML = `${head('Agents', '')}${errorBox(e)}`; return; }
  const { list, current } = d;
  const n = { all: list.length, online: list.filter((a) => !a.stale).length, working: list.filter((a) => a.working).length, outdated: list.filter((a) => a.outdated).length };
  const strip = await networkStats(list).catch(() => '');
  const tabs = `<div class="tabs" role="tablist">${[['live', 'Live agents'], ['board', 'Leaderboard']].map(([k, l]) => `<button type="button" role="tab" data-atab="${k}" aria-selected="${AgentView.tab === k}">${l}</button>`).join('')}</div>`;
  const top = `
    ${head('Agents', AGENTS_INTRO)}
    <div class="grid g-4">
      ${kpi('Agents connected', fmt(n.all), 'one per enrolled seat', true)}
      ${kpi('Online', fmt(n.online), `heartbeat in the last ${HEARTBEAT_STALE_MS / 60000} min`)}
      ${kpi('Working now', fmt(n.working), 'on a task at this moment')}
      ${kpi('Older version', fmt(n.outdated), current ? `latest <span class="mono">${esc(shortVersion(current))}</span>` : 'running an older agent')}
    </div>
    ${strip}
    ${tabs}`;

  if (AgentView.tab === 'board') {
    let board;
    try { board = await leaderboardHtml(); } catch (e) { board = errorBox(e); }
    el.innerHTML = `${top}
      <form class="search lb-search" id="agent-search" role="search"><label class="sr" for="aq">Find a seat</label>${ICON.search}<input id="aq" type="search" placeholder="Seat number, agent id or owner wallet" value="${esc(AgentView.q)}"></form>
      ${board}`;
  } else {
    const q = AgentView.q.trim().toLowerCase().replace(/^#/, '');
    const match = (a) => !q || (a.tokenId && a.tokenId === q) || (a.agentId && a.agentId === q) || (a.wallet && a.wallet.startsWith(q)) || (q.length > 2 && a.model.toLowerCase().includes(q));
    const pass = { all: () => true, online: (a) => !a.stale, working: (a) => a.working, outdated: (a) => a.outdated }[AgentView.filter] || (() => true);
    const rows = list.filter((a) => pass(a) && match(a)).sort((a, b) => (b.working - a.working) || (b.accepted - a.accepted));
    const shown = rows.slice(0, AgentView.show);
    const f = (k, l) => `<button type="button" data-af="${k}" aria-pressed="${AgentView.filter === k}">${l} <span class="muted">${fmt(n[k])}</span></button>`;
    const upd = n.outdated && (AgentView.filter === 'outdated' || n.outdated / Math.max(1, n.all) > 0.02)
      ? `<div class="banner warn">${ICON.info}<div><p><b>${fmt(n.outdated)} agent${n.outdated === 1 ? ' runs' : 's run'} an older IMD worker</b> than the latest release <span class="mono">${esc(shortVersion(current))}</span>. They still take work, but without the latest fixes. Running one of them?</p>${updateFix()}</div></div>` : '';
    el.innerHTML = `${top}
      ${upd}
      <div class="toolbar agents-bar">
        <div class="seg seg-4" role="group" aria-label="Filter agents">${f('all', 'All')}${f('online', 'Online')}${f('working', 'Working')}${f('outdated', 'Older')}</div>
        <form class="search" id="agent-search" role="search"><label class="sr" for="aq">Find an agent</label>${ICON.search}<input id="aq" type="search" placeholder="Seat, agent id, wallet or model" value="${esc(AgentView.q)}"></form>
      </div>
      <section class="panel"><div class="table-wrap"><table>
        <thead><tr><th>Agent</th><th>Status</th><th class="r">Accepted</th><th>Success</th><th class="r">Turns</th><th class="r">Time working</th><th>Version</th><th>Connected</th><th>Model</th><th>Wallet</th></tr></thead>
        <tbody>${shown.map((a) => `<tr ${a.tokenId ? `data-open-seat="${esc(a.tokenId)}" tabindex="0"` : ''}>
          <td><span class="agent-id">${a.tokenId ? `<img src="${IMD_API}/agents/by-token/${esc(a.tokenId)}.svg" alt="" width="28" height="28" loading="lazy" onerror="this.style.visibility='hidden'">` : ''}<span><span class="t">IMD #${esc(a.tokenId || '—')}</span><span class="s">agent ${esc(a.agentId || '—')}</span></span></span></td>
          <td>${agentStatus(a)}</td>
          <td class="r num"><b>${fmt(a.accepted)}</b></td>
          <td>${a.attempts ? `<div class="rate"><span class="bar"><span style="width:${pct(a.accepted, a.attempts)}%"></span></span><span class="num" style="font-size:12px">${pct(a.accepted, a.attempts)}%</span></div>` : '<span class="muted">new</span>'}</td>
          <td class="r num">${a.turns ? compact(a.turns) : '—'}</td>
          <td class="r num muted">${hoursMs(a.workMs)}</td>
          <td><span class="mono" style="font-size:12px">${esc(shortVersion(a.version) || '—')}</span>${a.outdated ? ' <span class="tag warn" title="Update with: imd update, then restart the agent">update</span>' : ''}</td>
          <td class="muted" style="white-space:nowrap">${a.connectedAt ? esc(dur(a.connectedAt, new Date().toISOString())) : '—'}</td>
          <td class="muted" style="white-space:nowrap">${esc(a.model || a.runtime || '—')}</td>
          <td>${a.wallet ? `<a href="#" data-wallet="${esc(a.wallet)}" class="mono muted">${esc(short(a.wallet))}</a>${isTreasury(a.wallet) ? ' <span class="tag">Treasury</span>' : ''}` : '<span class="muted">—</span>'}</td>
        </tr>`).join('')}</tbody></table></div>
        ${rows.length ? '' : `<div class="empty"><b>No agents match${q ? ` "${esc(AgentView.q)}"` : ''}.</b></div>`}
        ${rows.length > shown.length ? `<div class="panel-body" style="text-align:center"><button type="button" class="btn small ghost" id="a-more">Show more · ${fmt(rows.length - shown.length)} left</button></div>` : ''}
      </section>
      <p class="muted" style="font-size:12px">Presence from IMD's list of connected agents, track record from its per-agent totals. ${d.fromRelease ? 'Versions are compared with the latest IMD worker release.' : 'Versions are compared with the one most agents run.'} Updated every 20 seconds.</p>`;
  }

  el.querySelectorAll('[data-atab]').forEach((b) => b.addEventListener('click', () => { AgentView.tab = b.dataset.atab; AgentView.q = ''; viewAgents(el); }));
  el.querySelectorAll('[data-af]').forEach((b) => b.addEventListener('click', () => { AgentView.filter = b.dataset.af; AgentView.show = 100; viewAgents(el); }));
  el.querySelectorAll('[data-lbs]').forEach((b) => b.addEventListener('click', () => { AgentView.sort = b.dataset.lbs; AgentView.lbShow = 50; viewAgents(el); }));
  el.querySelector('#agent-search')?.addEventListener('submit', (e) => { e.preventDefault(); AgentView.q = el.querySelector('#aq').value; AgentView.show = 100; AgentView.lbShow = 50; viewAgents(el); });
  el.querySelector('#a-more')?.addEventListener('click', () => { AgentView.show += 200; viewAgents(el); });
  el.querySelector('#lb-more')?.addEventListener('click', () => { AgentView.lbShow += 100; viewAgents(el); });
}

/* IMD Tools: request builder. Mirrors the rules in IMD's docs so a request is right before it's sent. */
'use strict';

const SITE_LABEL = /^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])?$/;
const REFERENCE_ONLY = ['defi-native', 'solidity-security-review', 'uniswap-v4-hooks', 'uniswap-v4-security', 'pashov-skill', 'public-rpcs', 'evm-project-launch'];
const NEEDS_PATHS = ['implement-contract', 'implement-one-contract', 'implement-and-test', 'implement-component', 'write-foundry-tests', 'refine-project', 'write-readme-and-docs', 'deploy-script', 'gas-and-size-report'];

function toLabel(name) {
  const s = String(name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32).replace(/-+$/g, '');
  return s.length >= 3 ? s : '';
}
const bytes = (o) => new Blob([JSON.stringify(o)]).size;

function checkRelease(q, skills) {
  const input = q.input; const d = input.draft; const steps = d.steps || [];
  const out = [];
  const add = (ok, text) => out.push({ ok, text });
  add(input.request.length >= 40, 'The request describes the project in enough detail for the evaluator');
  add(!!d.objective && d.objective.length <= 8000, 'The objective is set and under 8,000 characters');
  add(d.shape === 'chain', 'Steps run as a chain, one after another');
  add(steps.filter((s) => s.skill === 'frontend-for-contract' || s.skill === 'build-website').length === 1, 'Exactly one website step');
  add(steps.some((s) => s.skill === 'adversarial-review'), 'An independent review by a different seat');
  add(steps.every((s) => !NEEDS_PATHS.includes(s.skill) || (s.paths && s.paths.length)), 'Every writing step says which files it may change');
  add(steps.every((s) => !REFERENCE_ONLY.includes(s.skill) && (!skills.length || skills.includes(s.skill))), 'Every step uses a skill IMD offers');
  add(typeof d.ipfs === 'string' && SITE_LABEL.test(d.ipfs), `Site name "${d.ipfs || ''}" is 3–32 lowercase letters, digits or hyphens`);
  add(input.permissions.onchain.kind === d.onchain && input.permissions.onchain.chainId === 11155111, 'Launch permission matches the draft and targets Sepolia');
  add(bytes(q) <= 16384, `Request size ${compact(bytes(q))} bytes, under the 16 KiB limit`);
  return out;
}

function checkOracleBody(q) {
  const b = q.input; const out = [];
  const add = (ok, text) => out.push({ ok, text });
  add(b.question.length >= 12 && b.question.length <= 2000, 'The question is specific and under 2,000 characters');
  add(/\?\s*$/.test(b.question) || /answer with/i.test(b.question), 'It reads as one question with a clear answer format');
  add(b.panelSize >= 5 && b.panelSize <= 10, 'Panel of 5 to 10 agents');
  add(b.quorum >= 2 && b.quorum <= b.panelSize, 'Quorum between 2 and the panel size');
  add(b.window.hours >= 1 && b.window.hours <= 720, 'Time window between 1 hour and 30 days');
  add(b.validForSeconds >= 60 && b.validForSeconds <= 2592000, 'The signed answer stays valid for up to 30 days');
  add(b.evidence === 'chain' || !!b.definitions?.missing, 'Missing evidence is reported, not guessed');
  add(bytes(q) <= 16384, 'Under the 16 KiB limit');
  return out;
}

function releaseBody() {
  const r = Builder.release;
  const name = r.name.trim() || 'Untitled';
  const sym = r.symbol.trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 11);
  const label = r.label || toLabel(name);
  const isHook = r.kind === 'univ4_hook';
  const steps = [{ skill: 'build-contract-project', acceptanceCriteria: [sym ? `The token symbol is ${sym} and its supply is fixed at deployment` : 'Supply and roles are fixed at deployment'] }];
  if (r.tests) steps.push({ skill: 'write-foundry-tests', paths: ['test'], objective: 'Unit, fuzz and invariant tests for every contract.' });
  if (r.docs) steps.push({ skill: 'write-readme-and-docs', paths: ['README.md', 'docs'], objective: 'A README that explains what each contract does and how to use it.' });
  steps.push({ skill: 'adversarial-review' });
  steps.push({ skill: 'frontend-for-contract', objective: 'A one-page site that connects a wallet on Sepolia and works against the live contracts.' });
  const request = `Release ${name}${sym ? ` (${isHook ? 'token' : 'ERC-20'} symbol ${sym})` : ''} on Sepolia as ${isHook ? 'a univ4_hook' : 'an evm_project'}. ${r.what.trim()}\n\nBuild the contracts with ${r.tests ? 'a full Foundry test suite and ' : ''}an independent review, deploy them, then publish a website that works against the live deployment.`;
  return {
    requestKey: crypto.randomUUID ? crypto.randomUUID() : '00000000-0000-4000-8000-000000000000',
    action: 'workflow.open',
    input: {
      request,
      context: `Sepolia only. GitHub publication and IPFS hosting are approved. Site name ${label}. No admin keys and no upgradeability unless stated above.`,
      draft: {
        objective: `Build ${name} with ${r.tests ? 'tests and ' : ''}an independent review, deploy it, then build the website against the live deployment.`,
        shape: 'chain', onchain: r.kind, github: true, ipfs: label,
        references: isHook ? ['uniswap-v4-hooks', 'uniswap-v4-security'] : ['solidity-security-review'],
        steps,
      },
      permissions: { github: true, ipfs: label, onchain: { kind: r.kind, chainId: 11155111 } },
    },
  };
}

function oracleBody() {
  const o = Builder.oracle;
  const input = {
    v: 1, question: o.question.trim(), chainId: 1, window: { hours: Number(o.hours) || 24 },
    answerType: o.answerType, evidence: o.evidence, panelSize: Number(o.panelSize), quorum: Number(o.quorum),
    validForSeconds: Math.round((Number(o.validHours) || 24) * 3600),
  };
  if (o.evidence === 'panel') {
    input.definitions = { missing: 'Unavailable evidence is not false. Report inability rather than guessing.' };
    if (safeUrl(o.source)) input.guards = { sources: [o.source], minSources: 1 };
  }
  return { requestKey: crypto.randomUUID ? crypto.randomUUID() : '00000000-0000-4000-8000-000000000000', action: 'oracle.request', input };
}

      ${mainnetStrip()}
      <header class="topbar">
        <div class="left"><span class="mobile-brand">${brand('#home')}</span><span class="source">${sourceChip()}${Data.live ? `<span class="muted" id="upd">updated ${esc(ago(Data.at))}</span>` : ''}</span></div>
        <div class="right">
          <button type="button" class="icon-btn qj-btn" data-quick aria-label="Jump to a seat or page" title="Jump to a seat or page (press /)">${ICON.search}<kbd>/</kbd></button>
          ${Data.live ? `<button type="button" class="icon-btn" id="refresh" aria-label="Refresh data" title="Refresh">${ICON.refresh}</button>` : ''}
          <span class="social-top">${socialButtons('icon-btn')}</span>
          ${Theme.button()}
          <a class="btn small ghost hide-xs" href="#home">About</a>
        </div>
      </header>
      <nav class="mobile-nav" aria-label="Sections">${NAV.flatMap(([, i]) => i).map(([r, l]) => `<a href="#${r}" ${r === route ? 'aria-current="page"' : ''}>${l}</a>`).join('')}<a href="${LINKS.github}" target="_blank" rel="noopener">GitHub ↗</a><a href="${LINKS.x}" target="_blank" rel="noopener">X ↗</a></nav>
      <main class="page" id="page" tabindex="-1">${loading(6)}</main>
    </div>
  </div>`;
}

let renderSeq = 0;
async function route() {
  const seq = ++renderSeq;
  closeDrawer();
  const [r, arg] = ((location.hash || '#home').slice(1) || 'home').split('/');
  const root = document.getElementById('root');
  document.title = r === 'home' ? 'IMD Tools' : `${TITLES[r] || 'IMD Tools'} · IMD Tools`;
  window.scrollTo(0, 0);
  if (r === 'home' || !VIEWS[r]) {
    root.innerHTML = `<div style="min-height:60vh"></div>`;
    try { await renderLanding(root); } catch (e) { console.error(e); root.innerHTML = `<div class="wrap" style="padding-block:40px">${errorBox(e)}</div>`; }
    return;
  }
  root.innerHTML = shell(r === 'seat' ? 'seats' : r);
  root.querySelector('#refresh')?.addEventListener('click', () => { Data.refresh(); refreshView(true); });
  const page = root.querySelector('#page');
  lastRun[r] = Date.now();
  try {
    await (arg ? VIEWS[r](page, decodeURIComponent(arg)) : VIEWS[r](page));
  } catch (e) {
    console.error(e);
    if (seq === renderSeq) page.innerHTML = errorBox(e);
  }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-copy],[data-open-job],[data-open-seat],[data-open-wf],[data-open-launch],[data-open-oracle],[data-wallet],[data-close]');
  if (!t) return;
  if (t.hasAttribute('data-close')) return closeDrawer();
  if (t.dataset.copy) { e.preventDefault(); e.stopPropagation(); return copyText(t.dataset.copy); }
  if (t.tagName === 'A' && t.getAttribute('href') !== '#') return;
  e.preventDefault();
  if (t.dataset.openJob) return openJob(t.dataset.openJob);
  if (t.dataset.openSeat) return openSeat(t.dataset.openSeat);
  if (t.dataset.openWf) return openWorkflow(t.dataset.openWf);
  if (t.dataset.openLaunch) return openLaunch(t.dataset.openLaunch);
  if (t.dataset.openOracle) return openOracle(t.dataset.openOracle);
  if (t.dataset.wallet) { closeDrawer(); store.set('wallet', t.dataset.wallet); location.hash = 'wallet'; if (location.hash === '#wallet') route(); }
});
document.addEventListener('click', (e) => { if (e.target.closest('[data-theme-toggle]')) Theme.toggle(); });
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[tabindex]')) { e.preventDefault(); e.target.click(); }
});
window.addEventListener('hashchange', route);
document.addEventListener('click', (e) => { if (e.target.closest('[data-retry]')) { Data.refresh(); route(); } });

// ---------- continuous updates ----------
// Every page re-reads IMD on its own cadence and redraws in place, keeping filters, scroll and open panels.
const CADENCE = { agents: 45, treasury: 60, overview: 30, tasks: 30, releases: 45, launches: 60, showcase: 120, oracle: 45, seats: 60, holders: 300 };
// Live updates pause while nobody is using the page (no scroll, click, key or touch for 3 minutes)
// and resume on the next interaction, so a forgotten tab doesn't keep calling the server.
const Activity = { last: Date.now(), idle() { return Date.now() - this.last > 180000; } };
for (const ev of ['pointerdown', 'pointermove', 'keydown', 'scroll', 'touchstart', 'wheel']) {
  window.addEventListener(ev, () => { const was = Activity.idle(); Activity.last = Date.now(); if (was) refreshView(); }, { passive: true });
}
let refreshing = false;
async function refreshView(force = false) {
  const r = (location.hash || '#home').slice(1) || 'home';
  const page = document.getElementById('page');
  if (!Data.live || refreshing || !page || !CADENCE[r]) return;
  const a = document.activeElement;
  if (!force && a && page.contains(a) && a.matches('input, textarea, select')) return; // don't redraw under someone typing
  refreshing = true;
  const y = window.scrollY; const seq = renderSeq;
  try {
    await Data.get('/swarm', 8000).catch(() => null);
    if (r === 'tasks') { await refreshTasks(); if (seq === renderSeq) await viewTasks(page, false); }
    else if (r === 'showcase') { await refreshShow(); if (seq === renderSeq) await viewShowcase(page, false); }
    else if (seq === renderSeq) await VIEWS[r](page);
    if (seq === renderSeq) window.scrollTo(0, y);
  } catch (e) { console.warn('refresh', e); }
  finally { refreshing = false; tickClock(); }
}
const lastRun = {};
setInterval(() => {
  if (document.hidden || Activity.idle()) return;
  const r = (location.hash || '#home').slice(1) || 'home';
  const every = (CADENCE[r] || 0) * 1000;
  if (!every) return;
  if (Date.now() - (lastRun[r] || 0) >= every) { lastRun[r] = Date.now(); refreshView(); }
}, 2500);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshView(); });
function tickClock() { const u = document.getElementById('upd'); if (u) u.textContent = `updated ${ago(Data.at)}`; }
setInterval(tickClock, 5000);

Theme.init();
Data.boot().then(() => {
  route();
  // Started on the snapshot because IMD was slow to answer: keep trying, and switch to live data once it does.
  if (!Data.live) {
    const retry = setInterval(async () => {
      try { const j = await Data.fetchJson('/swarm', 8000, 1); if (j?.health) { clearInterval(retry); Data.mode = 'live'; Data.cache.set('/swarm', { t: Date.now(), v: j }); Data.store.write('/swarm', j); route(); } } catch {}
    }, 12000);
  }
});

</script>
</body>
</html>
