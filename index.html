<style>
/* IMD Tools, in the IMD control-room language: a wall of instrument panels, black terminal screens,
   phosphor-green readouts, monospace everything, hard 1px edges.
   Layout: landing = instrument wall + live terminal; app = black rack sidebar + boxed readout panels. */
:root {
  --bg: #D5D5CE;          /* panel-wall grey */
  --surface: #E8E8E2;     /* module face */
  --surface-2: #DDDDD6;
  --ink: #0C0C0B;
  --ink-2: #2D2D29;
  --muted: #595953;
  --line: #BDBDB5;        /* inner rules */
  --edge: #0C0C0B;        /* module outlines */
  --accent: #117A36;      /* phosphor green, printed on grey */
  --accent-ink: #0B6A2D;
  --signal: #C4471C;      /* the red-orange label colour */
  --good: #117A36; --warn: #8F5B00; --bad: #BF2F26; --info: #1F4FA0;
  --screen: #0A0B0A; --screen-2: #111311; --screen-line: #1F2A21;
  --phosphor: #43E07D; --phosphor-dim: #2B8F50; --screen-ink: #C7F3D4; --screen-muted: #6F8A76;
  --rack: #050505; --rack-ink: #D5D5CE;

  --f-mono: 'Geist Mono', 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --f-dot: 'Doto', 'Geist Mono', ui-monospace, monospace;
  --r: 2px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0A0A; --surface: #121211; --surface-2: #191917; --ink: #E7E7E0; --ink-2: #BDBDB4; --muted: #8C8C84;
    --line: #2A2A26; --edge: #3A3A35; --accent: #43E07D; --accent-ink: #5CE890; --signal: #F07A45;
    --good: #43E07D; --warn: #E5AA3E; --bad: #F2766C; --info: #7AAAF6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0A0A; --surface: #121211; --surface-2: #191917; --ink: #E7E7E0; --ink-2: #BDBDB4; --muted: #8C8C84;
  --line: #2A2A26; --edge: #3A3A35; --accent: #43E07D; --accent-ink: #5CE890; --signal: #F07A45;
  --good: #43E07D; --warn: #E5AA3E; --bad: #F2766C; --info: #7AAAF6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-mono); font-size: 14px; line-height: 1.55; letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-mono); font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; margin: 0; }
p { margin: 0; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.eyebrow, .cap { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

/* ---------- brand ---------- */
.brand { display: inline-flex; align-items: stretch; text-decoration: none; color: inherit; border: 1px solid currentColor; height: 38px; }
.brand .glyph { width: 38px; display: grid; place-items: center; border-right: 1px solid currentColor; }
.brand .glyph svg { width: 20px; height: 20px; }
.brand .word { display: flex; align-items: center; padding: 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .32em; white-space: nowrap; }
.brand.inv { background: #E8E8E2; color: #0C0C0B; border-color: #E8E8E2; }
.brand.inv .glyph { border-color: #0C0C0B; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 44px; padding: 0 18px; border-radius: var(--r); border: 1px solid var(--ink);
  background: var(--ink); color: var(--bg); font-weight: 600; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase;
  text-decoration: none; cursor: pointer; white-space: nowrap; transition: background .12s ease, color .12s ease;
}
.btn:hover { background: var(--accent); border-color: var(--accent); color: #050505; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--edge); }
.btn.ghost:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #050505; }
.btn.accent:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 11.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; }
.icon-btn {
  width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: var(--r);
  border: 1px solid var(--edge); background: transparent; cursor: pointer; color: inherit;
}
.icon-btn:hover { background: var(--ink); color: var(--bg); }
.icon-btn svg { width: 16px; height: 16px; }

/* ---------- pills & chips ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 1px 7px; border-radius: var(--r);
  font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; line-height: 18px;
  border: 1px solid color-mix(in srgb, var(--c, var(--muted)) 55%, transparent);
  background: color-mix(in srgb, var(--c, var(--muted)) 10%, transparent); color: var(--c, var(--muted));
}
.pill::before { content: ""; width: 6px; height: 6px; background: currentColor; }
.pill.good { --c: var(--good); } .pill.warn { --c: var(--warn); } .pill.bad { --c: var(--bad); }
.pill.info { --c: var(--info); } .pill.accent { --c: var(--signal); }
.pill.live::before { animation: blink 1.2s steps(2, end) infinite; }
.tag {
  display: inline-flex; align-items: center; gap: 5px; padding: 0 7px; border-radius: var(--r); line-height: 20px;
  font-size: 11px; color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; letter-spacing: .02em;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  min-height: 34px; padding: 0 12px; border-radius: var(--r); border: 1px solid var(--edge); background: var(--surface);
  color: var(--ink-2); font-size: 11.5px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
}
.chip:hover { color: var(--ink); background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .n { opacity: .6; margin-left: 6px; font-variant-numeric: tabular-nums; }

@keyframes blink { 50% { opacity: 0; } }
@keyframes fresh { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } }
tr.fresh td, .ln.fresh { animation: fresh 2.6s ease-out; }
@keyframes rise { from { transform: translateY(4px); opacity: .001; } to { transform: none; opacity: 1; } }

/* ================= TOP BAR (shared, always black like the control room) ================= */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--rack); color: var(--rack-ink);
  border-bottom: 1px solid #1C1C1A;
}
.bar .in { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 24px; }
.bar .links { display: flex; align-items: center; gap: 28px; font-size: 12px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; }
.bar .links a { text-decoration: none; color: var(--rack-ink); text-transform: uppercase; letter-spacing: .16em; }
.bar .links a:hover { opacity: 1; color: var(--phosphor); }
.bar .right { display: flex; align-items: center; gap: 10px; }
.bar .icon-btn { border-color: transparent; color: var(--rack-ink); }
.bar .icon-btn:hover { background: #1A1A18; color: #fff; }
.bar .boxbtn {
  display: inline-flex; align-items: center; min-height: 38px; padding: 0 16px; border: 1px solid var(--rack-ink); color: var(--rack-ink);
  text-decoration: none; font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap;
}
.bar .boxbtn:hover { background: var(--rack-ink); color: var(--rack); }

/* ================= LANDING ================= */
.site { background: var(--rack); }
.wall-wrap { background: var(--rack); padding: 16px 24px 0; }
.wall { position: relative; height: clamp(600px, 82vh, 780px); border: 1px solid #2A2A26; background: #D5D5CE; overflow: hidden; }
.wall canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.term {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(880px, calc(100% - 48px)); background: var(--screen); color: var(--screen-ink);
  border: 1px solid #000; box-shadow: 0 0 0 6px #BDBDB5, 0 0 0 7px #0C0C0B, 0 30px 60px -20px rgba(0,0,0,.6);
  font-size: 12.5px; line-height: 1.6; display: flex; flex-direction: column;
}
.term .status { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--screen-line); color: var(--screen-muted); }
.term .status b { color: var(--screen-ink); font-weight: 700; }
.term .status .svcs span { color: var(--phosphor); margin-left: 12px; }
.term .status .svcs span.down { color: #F2766C; }
.term .body { padding: 12px 14px 8px; min-height: 0; }
.term .ttl { color: var(--signal); }
.term .ttl + div { color: var(--screen-muted); margin-bottom: 10px; }
.term .log { display: flex; flex-direction: column; }
.term .ln { display: grid; grid-template-columns: 14px 44px 78px minmax(0, 1fr) auto; gap: 10px; white-space: nowrap; }
.term .ln > * { overflow: hidden; text-overflow: ellipsis; }
.term .ln .p { color: var(--phosphor-dim); }
.term .ln .t { color: var(--screen-muted); }
.term .ln .v { color: var(--phosphor); }
.term .ln .r { color: var(--screen-muted); text-align: right; }
.term .ln:last-child { color: #fff; }
.term .ln:last-child .p { color: var(--signal); }
.term .ln:last-child .r { color: var(--phosphor); }
.term .out { color: var(--screen-ink); white-space: pre-wrap; margin-top: 6px; }
.term form { margin: 10px 14px; border: 1px solid var(--screen-line); display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.term form:focus-within { border-color: var(--phosphor-dim); }
.term form span { color: var(--phosphor-dim); }
.term input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--screen-ink); caret-color: var(--phosphor); font-size: 12.5px; }
.term input::placeholder { color: #4E6254; }
.term .foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 8px 14px 10px; color: var(--screen-muted); border-top: 1px solid var(--screen-line); }
.term .foot b { color: var(--screen-ink); }
.floor { height: 34px; background:
  repeating-linear-gradient(90deg, #0C0C0B 0 2px, transparent 2px 7px),
  linear-gradient(#050505, #111110); opacity: .9; }

.pitch { background: var(--bg); border-top: 1px solid var(--edge); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 24px; }
.pitch .in { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 48px; padding-block: 64px 56px; align-items: end; }
.pitch h1 { font-size: clamp(34px, 5vw, 64px); line-height: 1.02; letter-spacing: -0.045em; }
.pitch h1 em { font-style: normal; color: var(--accent-ink); }
.pitch .side-copy { display: flex; flex-direction: column; gap: 20px; }
.pitch .side-copy p { color: var(--ink-2); font-size: 15px; }
.ctas { display: flex; flex-wrap: wrap; gap: 10px; }
.indep { display: inline-flex; gap: 8px; align-items: center; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.indep::before { content: ""; width: 7px; height: 7px; background: var(--signal); }

.readouts { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--edge); border-bottom: 1px solid var(--edge); background: var(--edge); gap: 1px; }
.lcd { background: var(--screen); color: var(--screen-ink); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lcd .cap { color: var(--screen-muted); font-size: 10px; }
.lcd b { font-family: var(--f-dot); font-weight: 800; font-size: 34px; line-height: 1; color: var(--phosphor); font-variant-numeric: tabular-nums; letter-spacing: .02em; text-shadow: 0 0 12px rgba(67, 224, 125, .35); }

.section { padding-block: 80px; background: var(--bg); }
.section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; margin-bottom: 32px; flex-wrap: wrap; }
.section-head h2 { font-size: clamp(26px, 3.4vw, 40px); line-height: 1.05; max-width: 640px; }
.section-head p { max-width: 440px; color: var(--ink-2); }
.tools-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--edge); border: 1px solid var(--edge); }
.tool-card { display: flex; flex-direction: column; gap: 12px; padding: 22px; background: var(--surface); text-decoration: none; color: var(--ink); position: relative; }
.tool-card:hover { background: var(--ink); color: var(--bg); }
.tool-card:hover p, .tool-card:hover .datum { color: inherit; opacity: .8; }
.tool-card .plate { display: flex; justify-content: space-between; align-items: center; }
.tool-card .ico { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid currentColor; }
.tool-card .ico svg { width: 17px; height: 17px; }
.tool-card .code-no { font-size: 11px; letter-spacing: .14em; color: var(--muted); }
.tool-card:hover .code-no { color: var(--phosphor); }
.tool-card h3 { font-size: 17px; letter-spacing: -0.02em; }
.tool-card p { color: var(--ink-2); font-size: 13px; flex-grow: 1; }
.tool-card .datum { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; border-top: 1px dashed currentColor; padding-top: 10px; letter-spacing: .04em; text-transform: uppercase; }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--edge); border: 1px solid var(--edge); }
.flow .step { padding: 24px 22px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.flow .k { font-size: 11px; letter-spacing: .14em; color: var(--signal); text-transform: uppercase; }
.flow h3 { font-size: 17px; }
.flow p { font-size: 13px; color: var(--ink-2); }
.flow .facts { margin-top: auto; padding-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.site-foot { background: var(--rack); color: #A5A59D; }
.site-foot .in { padding-block: 40px 56px; display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; font-size: 12.5px; }
.site-foot .brand { color: var(--rack-ink); align-self: flex-start; }
.site-foot .links a, .site-foot a { color: #A5A59D; text-decoration: none; letter-spacing: .1em; text-transform: uppercase; font-size: 11.5px; }
.site-foot a:hover { color: var(--phosphor); }
.site-foot .links { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }

/* ================= APP ================= */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--rack); color: var(--rack-ink);
  padding: 14px 12px; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid #1C1C1A;
}
.side .brand { margin: 2px 4px 8px; align-self: flex-start; }
.nav-group { display: flex; flex-direction: column; gap: 1px; }
.nav-group .eyebrow { padding: 8px 10px 6px; color: #6F6F68; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; text-decoration: none; color: #BDBDB4;
  font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; border: 1px solid transparent;
}
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; color: #6F6F68; }
.nav-item:hover { color: #fff; border-color: #2A2A26; }
.nav-item[aria-current="page"] { color: #fff; border-color: #3A3A35; background: #121211; }
.nav-item[aria-current="page"] svg { color: var(--phosphor); }
.side .foot { margin-top: auto; font-size: 11px; color: #7C7C75; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; line-height: 1.5; }
.side .foot a:hover { color: var(--phosphor); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 15; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 28px; background: var(--bg); border-bottom: 1px solid var(--edge);
}
.topbar .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.topbar .mobile-brand { display: none; }
.topbar .right { display: flex; align-items: center; gap: 8px; }
.source { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink-2); }
.mobile-nav { display: none; }

.page { padding: 28px 28px 64px; display: flex; flex-direction: column; gap: 20px; max-width: 1340px; width: 100%; animation: rise .25s ease both; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.page-head h1 { font-size: 30px; line-height: 1.05; }
.page-head h1::before { content: "> "; color: var(--accent-ink); }
.page-head p { color: var(--ink-2); margin-top: 8px; max-width: 700px; font-size: 13.5px; }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; border: 1px dashed var(--edge); background: var(--surface); font-size: 13px; color: var(--ink-2); }
.banner svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; color: var(--signal); }
.banner b { font-weight: 700; color: var(--ink); }

.grid { display: grid; gap: 14px; }
.g-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }

.panel { background: var(--surface); border: 1px solid var(--edge); border-radius: var(--r); min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--edge); background: var(--surface-2); }
.panel-head h2 { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; }
.panel-head a { font-size: 11.5px; color: var(--muted); text-decoration: none; letter-spacing: .08em; text-transform: uppercase; }
.panel-head a:hover { color: var(--accent-ink); }
.panel-body { padding: 16px; }

/* readout tiles = small LCD screens */
.kpi { padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 5px; background: var(--screen); border-color: #000; color: var(--screen-ink); }
.kpi .label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--screen-muted); }
.kpi .value { font-family: var(--f-dot); font-size: 32px; font-weight: 800; line-height: 1.05; color: var(--phosphor); font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(67, 224, 125, .3); overflow-wrap: anywhere; }
.kpi .value .copy { font-family: var(--f-mono); font-size: 13px; color: var(--screen-ink); }
.kpi .sub { font-size: 11.5px; color: #9FB3A5; }
.kpi.hot .value { color: #FF8A4C; text-shadow: 0 0 10px rgba(255, 122, 54, .35); }

.svc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.svc > div { padding: 10px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.svc .k { font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }

.stack { display: flex; height: 16px; gap: 2px; }
.stack > span { display: block; min-width: 4px; height: 100%; }
.legend-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; margin-top: 14px; font-size: 12.5px; }
.legend-list div { display: flex; align-items: center; gap: 8px; }
.legend-list i { width: 9px; height: 9px; flex-shrink: 0; }
.legend-list b { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }

.list { display: flex; flex-direction: column; }
.row {
  display: flex; align-items: center; gap: 14px; padding: 11px 16px; border-top: 1px solid var(--line);
  text-decoration: none; color: inherit; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; cursor: pointer;
}
.row:first-child { border-top: 0; }
.row:hover { background: var(--surface-2); }
.row .main-col { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.row .t { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row .end { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--edge); white-space: nowrap; background: var(--surface-2); position: sticky; top: 0; }
th.r, td.r { text-align: right; }
th button { all: unset; cursor: pointer; }
th button:hover, th button[aria-sort] { color: var(--ink); }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td .t { font-weight: 600; display: block; max-width: 480px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td .s { font-size: 11px; color: var(--muted); }
.rate { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.rate .bar { flex: 1; height: 8px; border: 1px solid var(--edge); background: repeating-linear-gradient(90deg, transparent 0 5px, var(--line) 5px 6px); }
.rate .bar span { display: block; height: 100%; background: var(--good); }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.search { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border: 1px solid var(--edge); background: var(--surface); min-width: 0; flex: 1; max-width: 440px; }
.search svg { width: 15px; height: 15px; color: var(--muted); flex-shrink: 0; }
.search::before { content: ">"; color: var(--accent-ink); font-weight: 700; }
.search input { border: 0; outline: 0; background: transparent; width: 100%; min-width: 0; font-size: 13.5px; }
.search:focus-within { outline: 2px solid var(--accent); outline-offset: -1px; }

/* stage tracker = row of LEDs */
.stages { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; }
.stage { display: flex; flex-direction: column; gap: 5px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.stage i { display: block; height: 8px; border: 1px solid var(--edge); background: transparent; }
.stage.done i { background: var(--good); }
.stage.now i { background: var(--signal); animation: blink 1.2s steps(2, end) infinite; }
.stage.stop i { background: var(--bad); }
.stage.now span, .stage.stop span { color: var(--ink); font-weight: 700; }
.stage span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.card { background: var(--surface); border: 1px solid var(--edge); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.clickable { cursor: pointer; text-align: left; font: inherit; color: inherit; }
.card.clickable:hover { background: var(--surface-2); outline: 1px solid var(--edge); }
.card h3 { font-size: 16px; line-height: 1.25; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.card p, .drawer-head h2 { overflow-wrap: anywhere; }
.card .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 11.5px; color: var(--muted); }
.card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.launch-no { font-size: 11.5px; color: var(--muted); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.contracts { display: flex; flex-direction: column; border: 1px solid var(--line); }
.contracts > a, .contracts > div.c { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; text-decoration: none; border-top: 1px solid var(--line); font-size: 12.5px; }
.contracts > :first-child { border-top: 0; }
.contracts > a:hover { background: var(--surface-2); }
.contracts .nm { font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
.contracts .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.warnbox { border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); background: color-mix(in srgb, var(--warn) 8%, transparent); color: var(--ink-2); padding: 9px 11px; font-size: 12.5px; }
.warnbox b { color: var(--warn); }
.badbox { border: 1px solid color-mix(in srgb, var(--bad) 55%, transparent); background: color-mix(in srgb, var(--bad) 7%, transparent); padding: 9px 11px; font-size: 12.5px; color: var(--ink-2); }
.badbox b { color: var(--bad); }
.links { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; letter-spacing: .04em; }
.links a { color: var(--ink-2); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; text-transform: uppercase; }
.links a:hover { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }
.links svg { width: 14px; height: 14px; }

.answer { font-family: var(--f-dot); font-weight: 800; font-size: 28px; letter-spacing: .02em; line-height: 1.1; color: var(--accent-ink); overflow-wrap: anywhere; }
.answer.pending { font-family: var(--f-mono); font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; }

.scrim { position: fixed; inset: 0; background: rgba(5, 5, 5, .45); z-index: 40; animation: fade .15s ease both; }
@keyframes fade { from { opacity: 0; } }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); z-index: 41; background: var(--surface);
  border-left: 1px solid var(--edge); display: flex; flex-direction: column; animation: slide .2s ease both;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@keyframes slide { from { transform: translateX(20px); opacity: 0; } }
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px 14px; border-bottom: 1px solid var(--edge); background: var(--surface-2); }
.drawer-head h2 { font-size: 18px; line-height: 1.25; }
.drawer-body { padding: 18px 20px 32px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.drawer-body > div[id] { display: flex; flex-direction: column; gap: 18px; }
.drawer-body > div[id]:empty { display: none; }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; padding-top: 2px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.sub-h { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.copy { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; background: none; border: 0; padding: 0; color: inherit; }
.copy svg { width: 13px; height: 13px; opacity: .6; }
.copy:hover svg { opacity: 1; }

.empty { padding: 40px 20px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 8px; align-items: center; font-size: 13px; }
.empty b { color: var(--ink); font-weight: 700; }
.skeleton { height: 12px; background: repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 12px); animation: blink 1.4s steps(2, end) infinite; opacity: .7; }

.bars { display: flex; align-items: flex-end; gap: 12px; height: 180px; padding-top: 10px; }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; min-width: 0; }
.bars .b span.v { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bars .b i { display: block; width: 100%; max-width: 52px; background: var(--good); min-height: 3px; border: 1px solid var(--edge); }
.bars .b small { font-size: 11px; color: var(--muted); white-space: nowrap; }
.share { display: flex; align-items: center; gap: 8px; }
.share .bar { width: 90px; height: 8px; border: 1px solid var(--edge); }
.share .bar span { display: block; height: 100%; background: var(--good); }

.builder { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 14px; align-items: start; }
.form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field > span:first-child { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.field .hint { font-size: 11.5px; color: var(--muted); }
.field input[type="text"], .field input[type="number"], .field textarea, .field select {
  width: 100%; min-height: 42px; border-radius: var(--r); border: 1px solid var(--edge); background: var(--bg); padding: 9px 11px; font-size: 13.5px;
}
.field textarea { min-height: 110px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--edge); }
.seg button { min-height: 40px; border: 0; background: var(--surface); cursor: pointer; font-size: 11.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--edge); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.check input { width: 18px; height: 18px; margin-top: 1px; accent-color: var(--good); }
.checks { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
.checks div { display: flex; gap: 8px; align-items: flex-start; }
.checks svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 2px; }
.checks .ok svg { color: var(--good); } .checks .no svg { color: var(--bad); }
pre.code { margin: 0; padding: 14px; background: var(--screen); color: var(--screen-ink); font-size: 12px; line-height: 1.6; overflow: auto; max-height: 460px; white-space: pre; border: 1px solid #000; }
details summary { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--screen); color: var(--phosphor); border: 1px solid var(--phosphor-dim); padding: 9px 14px; font-size: 12.5px; animation: rise .2s ease both; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .g-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-21, .builder { grid-template-columns: minmax(0, 1fr); }
  .tools-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .readouts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pitch .in { grid-template-columns: minmax(0, 1fr); gap: 24px; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { padding: 10px 16px; }
  .topbar .mobile-brand { display: inline-flex; }
  .mobile-nav { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; border-bottom: 1px solid var(--edge); background: var(--rack); scrollbar-width: none; }
  .mobile-nav::-webkit-scrollbar { display: none; }
  .mobile-nav a { flex-shrink: 0; padding: 6px 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; text-decoration: none; color: #BDBDB4; border: 1px solid #2A2A26; }
  .mobile-nav a[aria-current="page"] { color: #fff; border-color: var(--phosphor-dim); }
  .page { padding: 20px 16px 48px; }
  .bar .links a.hide-s { display: none; }
  .g-3, .g-2 { grid-template-columns: minmax(0, 1fr); }
  .wall-wrap { padding: 12px 12px 0; }
  .wall { height: auto; min-height: 0; padding: 150px 12px 12px; }
  .wall canvas { height: 100%; }
  .term { position: relative; left: auto; top: auto; transform: none; width: 100%; }
  .term .ln { grid-template-columns: 12px 40px 66px minmax(0, 1fr); }
  .term .ln .r { display: none; }
}
@media (max-width: 640px) {
  .wrap { padding-inline: 16px; }
  .bar .in { padding: 10px 16px; }
  .bar .links { gap: 14px; }
  .g-6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-4 { grid-template-columns: minmax(0, 1fr); }
  .tools-grid, .flow { grid-template-columns: minmax(0, 1fr); }
  .readouts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .section { padding-block: 56px; }
  .svc { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .two { grid-template-columns: minmax(0, 1fr); }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .kv dd { margin-bottom: 8px; }
  .page-head h1 { font-size: 24px; }
  .legend-list { grid-template-columns: minmax(0, 1fr); }
  .topbar .source .when, .topbar #upd { display: none; }
  .brand .word { letter-spacing: .22em; padding: 0 10px; }
  .term .status .svcs { display: none; }
  .lcd b { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- token, treasury, terminal hero ---------- */
.is-off { opacity: .55; cursor: default; pointer-events: none; }
.bar .boxbtn.is-off { opacity: .5; }
.term .hero-t { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 14px 14px; border-bottom: 1px solid var(--screen-line); text-align: center; }
.term .pix { font-family: var(--f-dot); font-weight: 900; font-size: clamp(44px, 8.4vw, 104px); line-height: .9; letter-spacing: .04em; color: var(--phosphor); text-shadow: 0 0 18px rgba(67, 224, 125, .45), 0 0 2px rgba(67, 224, 125, .9); margin: 0; }
.term .tag-l { color: var(--screen-muted); font-size: 12px; letter-spacing: .06em; }
.term .hero-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.term .tbtn { display: inline-flex; align-items: center; min-height: 42px; padding: 0 18px; border: 1px solid var(--phosphor); color: var(--phosphor); text-decoration: none; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; background: transparent; }
.term .tbtn.solid { background: var(--phosphor); color: #050505; }
.term .tbtn:hover { background: var(--screen-ink); border-color: var(--screen-ink); color: #050505; }
.term .tbtn.is-off { border-color: #2B8F50; color: #6F8A76; }
.token { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 1px; background: var(--edge); border: 1px solid var(--edge); }
.token > div { background: var(--surface); padding: 26px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.token .big-t { font-family: var(--f-dot); font-weight: 900; font-size: clamp(40px, 6vw, 72px); line-height: 1; color: var(--accent-ink); }
.tk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--edge); border: 1px solid var(--edge); }
.tk-grid .lcd b { font-size: 30px; }
.flowline { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; border: 1px solid var(--edge); }
.flowline > div:last-child { background: color-mix(in srgb, var(--accent) 9%, transparent); }
@media (max-width: 1100px) and (min-width: 641px) {
  .flowline { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .flowline > div:nth-child(4) { border-left: 0; }
  .flowline > div:nth-child(n+4) { border-top: 1px solid var(--edge); }
  .flowline > div:nth-child(3):not(:last-child)::after { content: "↓"; right: 12px; top: auto; bottom: -11px; transform: none; }
}
.flowline > div { padding: 14px; border-left: 1px solid var(--edge); display: flex; flex-direction: column; gap: 4px; position: relative; }
.flowline > div:first-child { border-left: 0; }
.flowline b { font-size: 13px; }
.flowline span { font-size: 12px; color: var(--muted); }
.flowline > div:not(:last-child)::after { content: "→"; position: absolute; right: -8px; top: 50%; transform: translateY(-50%); background: var(--surface); color: var(--accent-ink); font-weight: 700; z-index: 1; }
.addr-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12.5px; }
.tools-grid .tool-card.wide { grid-column: span 2; }
@media (max-width: 1100px) { .token { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) {
  .tools-grid .tool-card.wide { grid-column: auto; }
  .flowline { grid-template-columns: minmax(0, 1fr); }
  .flowline > div { border-left: 0; border-top: 1px solid var(--edge); }
  .flowline > div:first-child { border-top: 0; }
  .flowline > div:not(:last-child)::after { content: "↓"; right: 12px; top: auto; bottom: -11px; transform: none; }
}

/* ---------- social + GitHub buttons ---------- */
.icon-btn .lbl, .social-top .lbl { display: none; }
a.icon-btn { text-decoration: none; }
.icon-btn svg[fill="currentColor"] { width: 15px; height: 15px; }
.bar .ghbtn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 14px; text-decoration: none;
  border: 1px solid var(--phosphor); color: var(--phosphor); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap;
}
.bar .ghbtn svg { width: 16px; height: 16px; }
.bar .ghbtn:hover { background: var(--phosphor); color: #050505; }
.bar a.icon-btn svg { width: 15px; height: 15px; }
.social-top { display: inline-flex; gap: 6px; }
.side .social { display: flex; gap: 6px; margin-top: 6px; }
.side .sbtn {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border: 1px solid #2A2A26; color: #D5D5CE; text-decoration: none;
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
}
.side .sbtn svg { width: 14px; height: 14px; }
.side .sbtn:hover { border-color: var(--phosphor); color: var(--phosphor); }
.tk-grid .lcd b.sm { font-size: 22px; }
.token .addr-row { margin-top: 14px; }
.side-copy p b { color: var(--ink); }

/* ---------- mobile ---------- */
@media (max-width: 900px) {
  .bar .in { gap: 10px; }
  .bar .links { display: none; }
  .term .status { font-size: 11px; }
  .term .hero-t { padding: 16px 12px 12px; gap: 12px; }
  .term .body { padding: 10px 12px 6px; }
  .term .ln { grid-template-columns: 10px 38px 58px minmax(0, 1fr); gap: 8px; font-size: 11.5px; }
  .term form { margin: 8px 12px; }
  .term .foot { font-size: 11px; }
  .wall { padding: 120px 10px 10px; }
  .pitch .in { padding-block: 40px 36px; }
}
@media (max-width: 640px) {
  .bar .in { padding: 8px 12px; }
  .bar .ghbtn { padding: 0 10px; min-height: 36px; }
  .bar .ghbtn span { display: none; }
  .bar .boxbtn { min-height: 36px; padding: 0 12px; font-size: 11px; letter-spacing: .12em; }
  .bar .icon-btn { width: 34px; height: 34px; }
  .bar .brand .word { display: none; }
  .bar .brand .glyph { border-right: 0; }
  .wall-wrap { padding: 8px 8px 0; }
  .wall { padding: 70px 8px 8px; }
  .term { box-shadow: 0 0 0 4px #BDBDB5, 0 0 0 5px #0C0C0B; }
  .term .status { gap: 4px; }
  .term .pix { font-size: 46px; }
  .term .tag-l { font-size: 11px; }
  .term .tbtn { min-height: 40px; padding: 0 10px; font-size: 11px; letter-spacing: .06em; white-space: nowrap; }
  .term .hero-btns { width: 100%; }
  .term .hero-btns > * { flex: 1; justify-content: center; }
  .term .ln { grid-template-columns: 40px 62px minmax(0, 1fr); gap: 8px; font-size: 11px; }
  .term .ln > * { text-overflow: clip; }

}

/* ---------- treasury flywheel ---------- */
.tsec { display: flex; flex-direction: column; gap: 16px; }
.tsec-flow { position: relative; background: var(--screen); border: 1px solid var(--edge); border-radius: var(--r); padding: 34px 28px 20px; color: var(--screen-ink); overflow: hidden;
  background-image: linear-gradient(rgba(67,224,125,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(67,224,125,.045) 1px, transparent 1px); background-size: 32px 32px; }
.tsec-flow::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 80% at 85% 30%, rgba(67,224,125,.09), transparent 70%); pointer-events: none; }
.tsec-wallet { position: relative; margin-top: 22px; padding-top: 16px; border-top: 1px dashed var(--screen-line); }

/* the rail through the nodes, with a pulse running along it */
.tflow-track::before { content: ""; position: absolute; left: 30px; right: calc((100% - 70px) / 6 - 30px); top: 29px; height: 2px; background: repeating-linear-gradient(90deg, var(--phosphor-dim) 0 6px, transparent 6px 11px); }

@keyframes tpulse { from { left: 30px; opacity: 0 } 8% { opacity: 1 } 92% { opacity: 1 } to { left: calc(100% - (100% - 70px) / 6 - 70px); opacity: 0 } }
.tstep { position: relative; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.ttext { display: flex; flex-direction: column; gap: 4px; }
.ttext b { font-size: 14px; color: var(--screen-ink); letter-spacing: .01em; }
.ttext > span { font-size: 12.5px; line-height: 1.5; color: var(--screen-muted); }
.ttext em { align-self: flex-start; margin-top: 6px; font-style: normal; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--screen); background: var(--phosphor); padding: 3px 7px; }
.tstep.end .tnode { background: var(--phosphor); color: var(--screen); border-color: var(--phosphor); box-shadow: 0 0 0 4px var(--screen), 0 0 24px rgba(67,224,125,.55); }
.tstep.end .tnode i { background: var(--phosphor); color: var(--screen); }
.tflow-loop { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--screen-muted); }

/* pending state */

.tp-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tp-cell { padding: 22px 18px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; background: var(--screen); }

@media (prefers-reduced-motion: reduce) { .tflow-track::after, .tflow-loop .dot, .tp-led { animation: none; } }
@media (max-width: 1100px) {

}
@media (max-width: 900px) {
  .tsec-flow { padding: 26px 18px 18px; }
  .tflow-track { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .tflow-track::before { left: 29px; right: auto; top: 30px; bottom: 30px; width: 2px; height: auto; background: repeating-linear-gradient(180deg, var(--phosphor-dim) 0 6px, transparent 6px 11px); }
  .tflow-track::after { display: none; }
  .tstep { flex-direction: row; align-items: flex-start; gap: 16px; }
  .ttext { padding-top: 6px; }
  .tp-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}
.tsec-wallet { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

/* ================= landing motion + polish ================= */

/* header: progress line + active link */
.bar { position: sticky; }
.bar-prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--phosphor); box-shadow: 0 0 10px var(--phosphor); transform-origin: 0 50%; transform: scaleX(0); pointer-events: none; }

.bar .links a:hover::after, .bar .links a.on::after { transform: scaleX(1); }

/* hero terminal: faint scanlines + a slow glow breathing on the title */

.pitch h1 .cur { display: inline-block; width: .5em; height: .82em; margin-left: .12em; vertical-align: -.06em; background: var(--accent-ink); animation: tblink 1.1s steps(2) infinite; }
.mods { display: grid; gap: 12px; }

.lcd.ro::after { content: ""; position: absolute; left: -40%; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(67,224,125,.07), transparent); animation: sweep 7s linear infinite; animation-delay: calc(var(--i) * .6s); }
@keyframes sweep { to { left: 140%; } }
/* section numbers */

/* tool cards */

.tool-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--phosphor); transform: scaleX(0); transform-origin: 0 50%; transition: transform .45s ease; }

.tool-card:hover .go .arr { transform: translateX(5px); }

/* tokenomics: dark screen side with the tax split */
.token > .tok-screen { background: var(--screen); color: var(--screen-ink); background-image: linear-gradient(rgba(67,224,125,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(67,224,125,.04) 1px, transparent 1px); background-size: 28px 28px; }

.split { display: flex; flex-direction: column; gap: 10px; }

.split-bar i { height: 22px; background: var(--screen-line); animation: cellfill 6s ease-in-out infinite; animation-delay: calc(var(--i) * 60ms); }

@keyframes cellfill { 0%, 6% { background: var(--screen-line); } 14%, 80% { background: var(--phosphor-dim); } 92%, 100% { background: var(--screen-line); } }
@keyframes taxpulse { 0%, 14% { opacity: .35; box-shadow: none; } 22% { opacity: 1; box-shadow: 0 0 22px rgba(240,122,69,.9); } 80% { opacity: 1; } 92%, 100% { opacity: .35; box-shadow: none; } }
.split-l { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--screen-muted); }
.split-l span { display: inline-flex; align-items: center; gap: 7px; }

.split-l .k.tax { background: var(--signal); }
.tok-screen { border-radius: var(--r); }
.panel-body > .tok-screen { background: var(--screen); padding: 16px; border: 1px solid var(--edge); }
/* footer wordmark */
.site-foot { position: relative; overflow: hidden; }
.foot-mark { font-family: var(--f-dot); font-weight: 900; font-size: clamp(64px, 15vw, 230px); line-height: .8; letter-spacing: .02em; text-align: center; white-space: nowrap; color: rgba(67,224,125,.07); padding: 0 12px 18px; user-select: none; }

/* ================= treasury flywheel ================= */
.wheel { position: relative; display: grid; grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); gap: 40px; align-items: center; }

.orbit { position: absolute; inset: 0; animation: orbit 9s linear infinite; pointer-events: none; }

.hub-glyph svg { width: 100%; height: 100%; }

.wnode.end i { background: var(--phosphor); color: var(--screen); }
@keyframes wlit { 0% { border-color: var(--phosphor); box-shadow: 0 0 0 5px var(--screen), 0 0 26px rgba(67,224,125,.75); transform: scale(1.1); } 16% { border-color: var(--phosphor); box-shadow: 0 0 0 5px var(--screen), 0 0 26px rgba(67,224,125,.75); transform: scale(1.1); } 24%, 100% { box-shadow: 0 0 0 5px var(--screen); transform: none; } }
.wsteps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }

@keyframes wstep { 0%, 16% { border-left-color: var(--phosphor); background: rgba(67,224,125,.08); } 24%, 100% { border-left-color: var(--screen-line); background: transparent; } }
.wstep.end .wn { color: var(--phosphor); }

.tp-cell b span:nth-child(2) { --d: .15s; } .tp-cell b span:nth-child(3) { --d: .3s; }
@keyframes dash { 0%, 100% { opacity: .25; } 40% { opacity: 1; text-shadow: 0 0 10px rgba(67,224,125,.6); } }
@media (max-width: 900px) {

/* ================= treasury vault + seat cards ================= */

  background-image: linear-gradient(rgba(67,224,125,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(67,224,125,.04) 1px, transparent 1px); background-size: 28px 28px; }
.v-main { position: relative; padding: 26px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--screen-line); background: radial-gradient(ellipse 90% 90% at 20% 30%, rgba(67,224,125,.12), transparent 70%); }

.v-main .led, .v-cell .led { width: 7px; height: 7px; display: inline-block; background: var(--phosphor); box-shadow: 0 0 8px var(--phosphor); animation: tblink 2.4s steps(2) infinite; }
.v-main b { font-family: var(--f-dot); font-weight: 900; font-size: clamp(48px, 6vw, 76px); line-height: .95; color: var(--phosphor); text-shadow: 0 0 22px rgba(67,224,125,.45); font-variant-numeric: tabular-nums; animation: pixglow 4s ease-in-out infinite; }
.v-main b small { font-family: var(--f-mono); font-size: 16px; font-weight: 700; margin-left: 10px; color: var(--screen-muted); text-shadow: none; letter-spacing: .1em; }
.v-sub { font-size: 12.5px; color: var(--screen-muted); }
.v-links { margin-top: auto; padding-top: 8px; }
.v-links a { color: var(--screen-ink); }
.v-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.v-cell { position: relative; padding: 22px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid var(--screen-line); }
.v-cell:first-child { border-left: 0; }
.v-cell .led { animation-delay: calc(var(--i) * .6s); }
.v-cell b { font-family: var(--f-dot); font-weight: 900; font-size: 42px; line-height: 1; color: var(--phosphor); text-shadow: 0 0 14px rgba(67,224,125,.35); }
.v-ico { position: absolute; top: 18px; right: 18px; width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--screen-line); color: var(--phosphor-dim); }
.v-ico svg { width: 16px; height: 16px; }
.seats-sec { display: flex; flex-direction: column; gap: 14px; }
.seats-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.seats-head h2 { font-size: 20px; margin-top: 4px; }
.seat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.seat-card { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 14px; padding: 16px; background: var(--screen); color: var(--screen-ink); border: 1px solid var(--screen-line); border-radius: var(--r); position: relative; overflow: hidden; transition: border-color .25s, transform .25s, box-shadow .25s; animation: cardin .5s ease both; animation-delay: calc(var(--i) * 60ms); }
.seat-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--phosphor); transform: scaleX(0); transform-origin: 0 50%; transition: transform .4s ease; }
.seat-card:hover, .seat-card:focus-visible { border-color: var(--phosphor-dim); transform: translateY(-3px); box-shadow: 0 10px 30px -12px rgba(67,224,125,.35); }
.seat-card:hover::before, .seat-card:focus-visible::before { transform: scaleX(1); }
@keyframes cardin { from { opacity: 0; transform: translateY(10px); } }
.sc-top { display: flex; align-items: center; gap: 12px; }
.sc-top img { width: 44px; height: 44px; border: 1px solid var(--screen-line); background: var(--screen-2); flex: none; }
.sc-id { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.sc-id b { font-size: 15px; }
.sc-id span { font-size: 12px; color: var(--screen-muted); }
.sc-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sc-stats > span { display: flex; flex-direction: column; gap: 3px; }
.sc-stats i { font-style: normal; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--screen-muted); }
.sc-stats b { font-family: var(--f-dot); font-weight: 900; font-size: 22px; line-height: 1; color: var(--phosphor); }
.sc-bar { height: 4px; background: var(--screen-line); }
.sc-bar > span { display: block; height: 100%; background: var(--phosphor); box-shadow: 0 0 8px var(--phosphor); }
.sc-foot { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--screen-muted); border-top: 1px dashed var(--screen-line); padding-top: 10px; }
.sc-foot .go { color: var(--phosphor); }
.sc-foot .arr { display: inline-block; transition: transform .25s; }
.seat-card:hover .sc-foot .arr { transform: translateX(4px); }
.seat-slot { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 16px; min-height: 172px; border: 1px dashed var(--screen-line); border-radius: var(--r); background: repeating-linear-gradient(135deg, transparent 0 10px, rgba(67,224,125,.025) 10px 20px), var(--screen); color: var(--screen-muted); animation: cardin .5s ease both; animation-delay: calc(var(--i) * 60ms); }
.seat-slot .cap { color: var(--screen-muted); }
.slot-ico { width: 40px; height: 40px; display: grid; place-items: center; border: 1px dashed var(--screen-line); color: var(--screen-line); margin-top: auto; }
.slot-ico svg { width: 20px; height: 20px; }
.seat-slot b { font-size: 14px; color: var(--screen-ink); opacity: .55; }
.seat-slot > span:last-child { font-size: 12px; }
.seat-slot.next { border-color: var(--phosphor-dim); animation: cardin .5s ease both, slotpulse 2.6s ease-in-out infinite .5s; }
.seat-slot.next .slot-ico { border-color: var(--phosphor-dim); color: var(--phosphor); }
.seat-slot.next b { opacity: 1; color: var(--phosphor); }
@keyframes slotpulse { 50% { box-shadow: 0 0 0 1px rgba(67,224,125,.25), 0 0 26px -6px rgba(67,224,125,.45); } }
@media (max-width: 1000px) {
  .vault { grid-template-columns: minmax(0, 1fr); }
  .v-main { border-right: 0; border-bottom: 1px solid var(--screen-line); }
}
@media (max-width: 640px) {
  .v-grid { grid-template-columns: minmax(0, 1fr); }
  .v-cell { border-left: 0; border-top: 1px solid var(--screen-line); }
  .v-cell:first-child { border-top: 0; }
  .seat-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .seat-card, .seat-slot, .seat-slot.next, .v-main b, .v-main .led, .v-cell .led { animation: none !important; } }

/* ===== treasury v2: live seat states, 2x2 vault ===== */
.v-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.v-cell { border-left: 1px solid var(--screen-line); border-top: 1px solid var(--screen-line); }
.v-cell:nth-child(odd) { border-left: 0; }
.v-cell:nth-child(-n+2) { border-top: 0; }
.v-cell b small { font-size: 20px; color: var(--screen-muted); margin-left: 4px; text-shadow: none; }
.fleet { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fleet span { display: inline-flex; align-items: center; gap: 7px; }
.fleet i { width: 8px; height: 8px; display: inline-block; }
.f-working i { background: var(--signal); box-shadow: 0 0 8px var(--signal); animation: tblink 1.2s steps(2) infinite; }
.f-online i { background: var(--phosphor); box-shadow: 0 0 8px var(--phosphor); animation: tblink 2.4s steps(2) infinite; }
.f-offline i { background: var(--screen-line); }
.seat-grid { grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.seat-card { padding: 18px; gap: 16px; }
.sc-av { position: relative; flex: none; }
.sc-av img { width: 52px; height: 52px; border: 1px solid var(--screen-line); background: var(--screen-2); display: block; }
.sc-dot { position: absolute; right: -4px; bottom: -4px; width: 12px; height: 12px; border: 2px solid var(--screen); background: var(--screen-line); }
.sc-top .pill { display: none; }
.sc-live { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 1px solid var(--screen-line); background: var(--screen-2); }
.sc-state { display: inline-flex; align-items: center; gap: 9px; font-family: var(--f-dot); font-weight: 900; font-size: 24px; line-height: 1; letter-spacing: .02em; color: var(--screen-muted); }
.sc-state i { width: 10px; height: 10px; background: var(--screen-line); }
.sc-sub { font-size: 12px; color: var(--screen-muted); }
.seat-card.st-online .sc-state { color: var(--phosphor); text-shadow: 0 0 12px rgba(67,224,125,.45); }
.seat-card.st-online .sc-state i, .seat-card.st-online .sc-dot { background: var(--phosphor); box-shadow: 0 0 10px var(--phosphor); animation: tblink 2.4s steps(2) infinite; }
.seat-card.st-online .sc-live { border-color: rgba(67,224,125,.35); background: linear-gradient(90deg, rgba(67,224,125,.10), transparent); }
.seat-card.st-working .sc-state { color: var(--signal); text-shadow: 0 0 12px rgba(240,122,69,.5); }
.seat-card.st-working .sc-state i, .seat-card.st-working .sc-dot { background: var(--signal); box-shadow: 0 0 10px var(--signal); animation: tblink 1s steps(2) infinite; }
.seat-card.st-working .sc-live { border-color: rgba(240,122,69,.45); background: linear-gradient(90deg, rgba(240,122,69,.12), transparent); }
.seat-card.st-working { border-color: rgba(240,122,69,.4); }
.seat-card.st-offline .sc-live { border-style: dashed; }
@media (max-width: 640px) { .v-grid { grid-template-columns: minmax(0, 1fr); } .v-cell { border-left: 0 !important; border-top: 1px solid var(--screen-line) !important; } .v-cell:first-child { border-top: 0 !important; } }

/* ---------- v1.3: seat track record, live activity, update fixes, network strip, leaderboard, seat check ---------- */
.sc-mini { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--screen-muted); }
.sc-mini b { color: var(--screen-ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.sc-warn { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: #F2A27C; border: 1px dashed rgba(240,122,69,.5); padding: 5px 9px; background: rgba(240,122,69,.07); }
.sc-warn svg { width: 14px; height: 14px; }
.banner.warn { border-style: solid; border-color: color-mix(in srgb, var(--signal) 55%, transparent); background: color-mix(in srgb, var(--signal) 7%, var(--surface)); }
.banner.warn > div { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.fix { display: flex; flex-direction: column; gap: 7px; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12.5px; color: var(--ink-2); }
.fix.compact { padding: 8px 10px; }
.fix-step { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.fix-step > i { font-style: normal; width: 20px; height: 20px; display: inline-grid; place-items: center; flex: none; background: var(--ink); color: var(--bg); font-size: 11px; font-weight: 700; }
.fix .copy { padding: 3px 8px; border: 1px solid var(--edge); background: var(--screen); color: var(--phosphor); font-size: 12px; max-width: 100%; overflow-wrap: anywhere; text-align: left; }
.fix .copy:hover { border-color: var(--phosphor-dim); }
.fix .copy svg { color: var(--screen-ink); }
.fix-note { font-size: 12px; color: var(--muted); display: block; line-height: 1.9; }
.fix a.btn { text-decoration: none; }

.live-dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; vertical-align: 1px; background: var(--good); box-shadow: 0 0 8px var(--good); animation: blink 1.2s steps(2, end) infinite; }
.act-body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; }
.act-list { display: flex; flex-direction: column; border: 1px solid #000; background: var(--screen); color: var(--screen-ink); }
.act-now { display: grid; grid-template-columns: auto auto minmax(0, 1fr); grid-template-areas: "dot id what" "dot id t"; column-gap: 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--screen-line); font-size: 12.5px; }
.act-now:first-child { border-top: 0; }
.act-now .sc-dot { grid-area: dot; position: static; width: 9px; height: 9px; border: 0; background: var(--screen-line); }
.act-now.st-online .sc-dot { background: var(--phosphor); box-shadow: 0 0 8px var(--phosphor); animation: tblink 2.4s steps(2) infinite; }
.act-now.st-working .sc-dot { background: var(--signal); box-shadow: 0 0 8px var(--signal); animation: tblink 1s steps(2) infinite; }
.act-id { grid-area: id; font-weight: 700; color: var(--phosphor); }
.act-now.st-working .act-id { color: #FF8A4C; }
.act-what { grid-area: what; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--screen-ink); text-decoration: none; }
a.act-what:hover { text-decoration: underline; }
.act-now .muted { color: var(--screen-muted); }
.act-t { grid-area: t; font-size: 11px; color: var(--screen-muted); }
.act-seat { flex: none; font-weight: 700; color: var(--accent-ink); }
.act-r { display: inline-flex; align-items: center; gap: 10px; flex: none; font-size: 11.5px; }

.netstrip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(0, 1.6fr); border: 1px solid #000; background: var(--screen); color: var(--screen-ink); border-radius: var(--r); }
.ns-cell { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-left: 1px solid var(--screen-line); min-width: 0; }
.ns-cell:first-child { border-left: 0; }
.ns-cell .cap { color: var(--screen-muted); font-size: 10px; }
.ns-cell > b { font-family: var(--f-dot); font-weight: 900; font-size: 24px; line-height: 1.05; color: var(--phosphor); font-variant-numeric: tabular-nums; }
.ns-sub { font-size: 11px; color: #9FB3A5; }
.ns-bar { display: flex; height: 10px; margin-top: 4px; border: 1px solid var(--screen-line); }
.ns-bar i, .ns-legend i { display: block; height: 100%; }
.ns-legend { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 11px; color: #9FB3A5; }
.ns-legend > span { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
.ns-legend i { width: 8px; height: 8px; flex: none; }
.ns-legend b { color: var(--screen-ink); font-weight: 600; }
.ns-bar .m0, .ns-legend .m0 { background: var(--phosphor); }
.ns-bar .m1, .ns-legend .m1 { background: #F07A45; }
.ns-bar .m2, .ns-legend .m2 { background: #7AAAF6; }
.ns-bar .m3, .ns-legend .m3 { background: #4A524D; }

.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--edge); }
.tabs button { border: 1px solid transparent; border-bottom: 0; background: none; padding: 10px 18px; cursor: pointer; font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); background: var(--surface); border-color: var(--edge); border-bottom: 1px solid var(--surface); box-shadow: inset 0 2px 0 var(--accent); }
.seg.seg-3 { grid-template-columns: repeat(3, minmax(0, auto)); }
.seg.seg-3 button { padding: 0 14px; white-space: nowrap; }
.lb-search { max-width: 440px; }
.lb-ours { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pod { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: auto auto minmax(0, 1fr); grid-template-areas: "rank av id" "n n n"; gap: 10px 12px; align-items: center; padding: 14px 16px; background: var(--screen); color: var(--screen-ink); border: 1px solid var(--screen-line); border-radius: var(--r); transition: border-color .2s, transform .2s; }
.pod:hover, .pod:focus-visible { border-color: var(--phosphor-dim); transform: translateY(-2px); }
.pod img { grid-area: av; border: 1px solid var(--screen-line); background: var(--screen-2); }
.pod-rank { grid-area: rank; font-family: var(--f-dot); font-weight: 900; font-size: 34px; line-height: 1; color: var(--phosphor); text-shadow: 0 0 12px rgba(67,224,125,.4); }
.pod.p1 { border-color: rgba(67,224,125,.55); box-shadow: 0 0 0 1px rgba(67,224,125,.2), 0 10px 30px -14px rgba(67,224,125,.5); }
.pod.p2 .pod-rank, .pod.p3 .pod-rank { color: var(--screen-ink); text-shadow: none; }
.pod-id { grid-area: id; display: flex; flex-direction: column; min-width: 0; }
.pod-id b { font-size: 15px; }
.pod-id span, .pod-n span { font-size: 11.5px; color: var(--screen-muted); }
.pod-n { grid-area: n; display: flex; align-items: baseline; gap: 10px; border-top: 1px dashed var(--screen-line); padding-top: 10px; }
.pod-n b { font-family: var(--f-dot); font-weight: 900; font-size: 26px; line-height: 1; color: var(--phosphor); }
.pod.ours { border-color: rgba(240,122,69,.6); }
table.lb tr.ours td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
table.lb tr.ours td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 55%, transparent); }

.check { display: flex; flex-direction: column; gap: 14px; }
.check-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr); background: var(--screen); color: var(--screen-ink); border-color: #000; }
.check-head > div { padding: 16px 18px; border-left: 1px solid var(--screen-line); display: flex; gap: 14px; align-items: center; min-width: 0; }
.check-head > div:first-child { border-left: 0; }
.ch-id img { border: 1px solid var(--screen-line); background: var(--screen-2); flex: none; }
.ch-id > div, .ch-verdict > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.ch-id b { font-family: var(--f-dot); font-weight: 900; font-size: 26px; line-height: 1; color: var(--phosphor); }
.ch-id span, .ch-verdict span { font-size: 12px; color: var(--screen-muted); overflow-wrap: anywhere; }
.ch-id a { color: var(--screen-ink); }
.ch-verdict b { font-size: 18px; }
.ch-led { width: 14px; height: 14px; flex: none; background: var(--phosphor); box-shadow: 0 0 12px var(--phosphor); animation: tblink 2.4s steps(2) infinite; }
.check-head.has-issues .ch-led { background: var(--signal); box-shadow: 0 0 12px var(--signal); animation-duration: 1s; }
.check-head.has-issues .ch-verdict b { color: #FF8A4C; }
.check-head.all-good .ch-verdict b { color: var(--phosphor); }
.ch-stats { display: grid !important; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px !important; }
.ch-stats > span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ch-stats i { font-style: normal; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--screen-muted); }
.ch-stats b { font-family: var(--f-dot); font-weight: 900; font-size: 20px; line-height: 1.05; color: var(--phosphor); overflow-wrap: anywhere; }
.ch-stats b.sm { font-family: var(--f-mono); font-size: 13px; font-weight: 600; color: var(--screen-ink); }
.steps-check { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--edge); background: var(--surface); border-radius: var(--r); }
.steps-check > li { display: flex; gap: 14px; padding: 14px 16px; border-top: 1px solid var(--line); }
.steps-check > li:first-child { border-top: 0; }
.steps-check .sc-ico svg { width: 22px; height: 22px; }
.steps-check li.ok .sc-ico { color: var(--good); }
.steps-check li.bad .sc-ico { color: var(--bad); }
.steps-check li.wait .sc-ico, .steps-check li.opt .sc-ico { color: var(--muted); }
.steps-check li.bad { background: color-mix(in srgb, var(--bad) 5%, transparent); }
.steps-check li.wait { opacity: .6; }
.sc-body { display: flex; flex-direction: column; gap: 10px; min-width: 0; flex: 1; }
.sc-t { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.sc-t b { font-size: 13.5px; }
.sc-t span { font-size: 12.5px; color: var(--muted); }
.steps-check li.bad .sc-t span { color: var(--ink-2); }
.check-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; font-size: 12px; }
@media (max-width: 1100px) {
  .netstrip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ns-cell { border-top: 1px solid var(--screen-line); }
  .ns-cell:nth-child(-n+2) { border-top: 0; }
  .ns-cell:nth-child(odd) { border-left: 0; }
  .ns-models { grid-column: 1 / -1; border-left: 0 !important; }
  .act-body { grid-template-columns: minmax(0, 1fr); }
  .check-head { grid-template-columns: minmax(0, 1fr); }
  .check-head > div { border-left: 0; border-top: 1px solid var(--screen-line); }
  .check-head > div:first-child { border-top: 0; }
}
@media (max-width: 640px) {
  .podium { grid-template-columns: minmax(0, 1fr); }
  .tabs button { padding: 10px 12px; }
  .act-r .muted { display: none; }
}
.fix a svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }
.fix a:not(.btn) { color: var(--accent-ink); }
.check, .steps-check, .check-head { width: 100%; max-width: none; }
#check-form { justify-content: flex-start; }
#check-form .chips { margin-left: auto; }
@media (max-width: 640px) { #check-form .chips { margin-left: 0; } }

/* ---------- v1.4: mainnet notice, ecosystem projects ---------- */
.mainnet-strip { display: flex; align-items: center; gap: 10px; padding: 7px 28px; background: var(--screen); color: var(--screen-ink); border-bottom: 1px solid #000; text-decoration: none; font-size: 12px; overflow: hidden; white-space: nowrap; }
.mainnet-strip i { width: 8px; height: 8px; flex: none; background: var(--phosphor); box-shadow: 0 0 10px var(--phosphor); animation: blink 1.2s steps(2, end) infinite; }
.mainnet-strip b { color: var(--phosphor); letter-spacing: .12em; text-transform: uppercase; font-size: 11px; }
.mainnet-strip span { color: var(--screen-muted); overflow: hidden; text-overflow: ellipsis; }

.eco-dots { position: absolute; inset: 24px 24px auto auto; width: 220px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; opacity: .8; }
.eco-dots i { aspect-ratio: 1; background: color-mix(in srgb, var(--brand) calc(15% + var(--d) * 3%), transparent); animation: ecodot 3.2s steps(2) infinite; animation-delay: calc(var(--d) * -170ms); }
@keyframes ecodot { 50% { background: color-mix(in srgb, var(--brand) 12%, transparent); } }
.eco-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 6s ease; }

.eco-body { padding: 24px 26px 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* ---------- v1.5: treasury history, holder calculator, share card, run-an-agent guide ---------- */

.th-row { display: grid; grid-template-columns: 20px 150px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; font-size: 13px; animation: cardin .4s ease both; animation-delay: calc(var(--i) * 50ms); }
.th-dot { width: 12px; height: 12px; background: var(--good); box-shadow: 0 0 8px var(--good); position: relative; z-index: 1; }

@media (max-width: 1100px) { .tr-extra, .run-top { grid-template-columns: minmax(0, 1fr); } }

/* v1.7 quick wins: seat actions, wallet buttons, quick jump */
#cmp-img svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px; }
.sd-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }

.qj-p { color: var(--phosphor); font-weight: 800; font-size: 18px; }

.qj-f input::placeholder { color: var(--screen-muted); }
.qj kbd { background: var(--screen-2); color: var(--screen-ink); border-color: var(--screen-line); }
.qj-list { padding: 6px; max-height: 46vh; overflow: auto; }

<script>
/* IMD Tools: core. Data layer, helpers, icons, router. */
'use strict';

const SNAP = window.IMD_SNAPSHOT;

// ---------- token & treasury settings: the only lines to edit at launch ----------
const CONFIG = Object.assign({
  tokenName: 'IMD Tools',
  ticker: 'IMDT',                  // shown as $IMDT
  contract: '0x6670a5f01b95ee8b1df6de3f298c99b73e2551b7',                    // the token's Ethereum mainnet contract, e.g. 0xabc…; enables Buy and live balances
  treasury: '0x06A9D2771938d5B4D4D017D2897776441fACe95a',                    // the treasury wallet that receives the tax and buys IMD seats
  totalSupply: 1000000000,
  taxPercent: 5,
  chain: 'Ethereum mainnet',
}, window.IMD_TOOLS_CONFIG || {});
const SEAT_COLLECTION = '0x0000ec93127baa929e58e97dd0095a2bfb38ec1d'; // IMD seat NFTs (from IMD /health)
const hasToken = () => /^0x[0-9a-fA-F]{40}$/.test(CONFIG.contract);
const hasTreasury = () => /^0x[0-9a-fA-F]{40}$/.test(CONFIG.treasury);
const isTreasury = (a) => hasTreasury() && String(a || '').toLowerCase() === CONFIG.treasury.toLowerCase();
const TICKER = () => '$' + CONFIG.ticker;
const buyUrl = () => hasToken() ? `https://app.uniswap.org/swap?chain=mainnet&inputCurrency=NATIVE&outputCurrency=${CONFIG.contract}` : null;
const buyButton = (cls = 'btn') => buyUrl()
  ? `<a class="${cls}" href="${esc(buyUrl())}" target="_blank" rel="noopener">Buy ${esc(TICKER())} ↗</a>`
  : `<span class="${cls} is-off" role="note" title="The Buy link opens on Uniswap once the contract is published">Buy ${esc(TICKER())} · soon</span>`;
const IMD_API = 'https://api.imd.fun';
const EXPLORER = 'https://explorer.imd.fun';
const RELAY = 'api/imd';

// ---------- data layer ----------
// Live: reads IMD through the relay deployed next to this page (api/imd/*).
// Preview: when no relay answers (e.g. inside the artifact viewer), it falls back
// to a real snapshot of IMD's public data taken when this page was built.
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const Data = {
  mode: 'snapshot',
  at: SNAP.at,
  cache: new Map(),
  lastError: null,

  // Last good answers kept in this browser, so a return visit paints at once and then refreshes.
  store: {
    MAX_AGE: 15 * 60000, MAX_BYTES: 400000,
    read(path) { try { const o = JSON.parse(localStorage.getItem('imdtools.c:' + path) || 'null'); return o && Date.now() - o.t < this.MAX_AGE ? o : null; } catch { return null; } },
    write(path, v) { try { const s = JSON.stringify({ t: Date.now(), v }); if (s.length < this.MAX_BYTES) localStorage.setItem('imdtools.c:' + path, s); } catch {} },
  },
  revalidate(path) {
    if (this.cache.get(path)?.pending) return;
    const hit = this.cache.get(path);
    const pending = this.fetchJson(path).then((v) => { this.cache.set(path, { t: Date.now(), v }); this.store.write(path, v); return v; })
      .catch(() => { if (hit && 'v' in hit) this.cache.set(path, hit); });
    this.cache.set(path, { ...(hit || { t: 0 }), pending });
    return pending;
  },

  async boot() {
    // A recent copy in this browser: show it immediately, refresh in the background.
    const kept = this.store.read('/swarm');
    if (kept?.v?.health) {
      this.mode = 'live'; this.cache.set('/swarm', { t: kept.t, v: kept.v });
      if (Number.isFinite(kept.v.at)) this.at = new Date(kept.v.at).toISOString();
      this.revalidate('/swarm');
      return;
    }

  init() { const t = store.get('theme'); document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark'); }, // night mode by default
  current() {
    const t = document.documentElement.getAttribute('data-theme');
    if (t) return t;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  },
  toggle() { const n = this.current() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); store.set('theme', n); },
  button() { return `<button type="button" class="icon-btn" data-theme-toggle aria-label="Switch light or dark" title="Light / dark">${ICON.moon}</button>`; },
};

function toast(msg) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
async function copyText(text, label = 'Copied') {
  try { await navigator.clipboard.writeText(text); toast(label); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); toast(ok ? label : 'Select the text and copy it manually');
  }
}
const copyBtn = (text, shown) => `<button type="button" class="copy mono" data-copy="${esc(text)}" title="Copy">${esc(shown ?? text)}${ICON.copy}</button>`;
const extLink = (url, text, icon = ICON.ext) => { const u = safeUrl(url); return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${icon}${esc(text)}</a>` : ''; };

const store = {
  get(k) { try { return localStorage.getItem('imdtools.' + k); } catch { return null; } },

async function landingData() {
  const sw = await Data.get('/swarm', 25000).catch(() => SNAP.swarm);
  const h = sw.health || {}; const c = sw.counts || {};
  const [wf, la, orc, jobs, seats] = await Promise.all([
    Data.get('/workflows?limit=40', 25000).catch(() => ({ workflows: [] })),
    Data.get('/launches?limit=12', 25000).catch(() => ({ launches: [] })),
    Data.get('/oracle/requests?limit=20', 25000).catch(() => ({ requests: [] })),
    Data.get('/jobs?limit=40', 25000).catch(() => ({ jobs: [] })),
    getSeats().catch(() => []),
  ]);
  rememberOracle(orc.requests);
  const working = workingNow(h, seats);
  const inFlight = (wf.workflows || []).filter((w) => !['completed', 'blocked', 'cancelled', 'superseded'].includes(w.status)).length;
  const log = buildLog(wf.workflows || [], la.launches || [], orc.requests || [], jobs.jobs || []);
  return { h, c, seats, working, inFlight, log };
}
